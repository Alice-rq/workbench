<style>
  *{box-sizing:border-box;margin:0;padding:0}
   :root{
    --bg:#f6f7fb;
    --panel:#ffffff;
    --panel-2:#f9fafb;
    --border:#e8e9ef;
    --text:#18181b;
    --text-2:#52525b;
    --text-3:#a1a1aa;
    --accent:#6366f1;
    --accent-soft:#eef0ff;
    --accent-hover:#4f46e5;
    --danger:#ef4444;
    --success:#10b981;
    --warn:#f59e0b;
    --hover:#f3f4f6;
    --font-size:16px;
    --line-height:1.9;
    --page-width:720px;
    --shadow-sm:0 1px 2px rgba(15,23,42,.04);
    --shadow-md:0 4px 12px rgba(15,23,42,.06);
    --shadow-lg:0 12px 32px rgba(15,23,42,.10);
    --radius:10px;
    --radius-lg:14px;
  }
   [data-theme="dark"]{
    --bg:#0f0f12;
    --panel:#18181b;
    --panel-2:#1f1f23;
    --border:#2a2a30;
    --text:#f4f4f5;
    --text-2:#a1a1aa;
    --text-3:#71717a;
    --accent:#818cf8;
    --accent-soft:#26273b;
    --accent-hover:#a5b4fc;
    --danger:#f87171;
    --success:#34d399;
    --warn:#fbbf24;
    --hover:#26262b;
    --shadow-sm:0 1px 2px rgba(0,0,0,.3);
    --shadow-md:0 4px 12px rgba(0,0,0,.35);
    --shadow-lg:0 12px 32px rgba(0,0,0,.45);
  }
  html,body{height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;font-size:14px;background:var(--bg);color:var(--text);overflow:hidden;-webkit-font-smoothing:antialiased}
  ::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}::-webkit-scrollbar-thumb:hover{background:var(--text-3)}
  .app{display:flex;flex-direction:column;height:100vh}
  .topbar{height:48px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 14px;gap:12px;border-bottom:1px solid var(--border);background:var(--panel)}
  .topbar-left,.topbar-right{display:flex;align-items:center;gap:6px}
  .logo{font-weight:700;font-size:14px;margin-right:8px;letter-spacing:.5px}
  .work-select{background:var(--panel-2);border:1px solid var(--border);color:var(--text);padding:5px 10px;border-radius:7px;font-size:13px;outline:none;max-width:200px;cursor:pointer}
  .save-status{font-size:12px;color:var(--text-3);min-width:52px;text-align:center}
  .btn{background:var(--panel-2);border:1px solid var(--border);color:var(--text);padding:6px 12px;border-radius:7px;font-size:13px;cursor:pointer;transition:all .15s;font-family:inherit}
  .btn:hover{background:var(--hover)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{opacity:.9}
  .btn.danger{color:var(--danger);border-color:var(--danger);background:transparent}
  .btn.danger:hover{background:var(--danger);color:#fff}
  .btn.small{padding:4px 10px;font-size:12px}
  .icon-btn{background:transparent;border:none;color:var(--text-2);cursor:pointer;padding:3px 6px;border-radius:5px;font-size:14px;line-height:1;font-family:inherit;opacity:0;transition:opacity .15s,background .15s}
  .icon-btn:hover{background:var(--hover);color:var(--text)}
  .topbar .icon-btn,.list-header .icon-btn,.tabs .icon-btn{opacity:1}
  .work-header:hover .icon-btn,.chapter-item:hover .icon-btn,.char-item:hover .icon-btn,.setting-item:hover .icon-btn,.event-item:hover .icon-btn,.clue-item:hover .icon-btn,.material-item:hover .icon-btn{opacity:1}
  .body{flex:1;display:flex;overflow:hidden}
  .sidebar{width:240px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
   .tabs{display:flex;flex-direction:row;padding:6px 6px;gap:2px;border-bottom:1px solid var(--border);flex-shrink:0;overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;padding:7px 4px;font-size:17px;line-height:1;background:transparent;border:none;border-radius:7px;color:var(--text-2);cursor:pointer;font-family:inherit;transition:all .15s}
  .tabs button:hover{color:var(--text)}
    .tabs button.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
  .tab-content{flex:1;overflow-y:auto;padding:8px}
  .filter-bar{display:flex;flex-wrap:wrap;gap:4px;padding:4px 4px 8px}
  .filter-chip{font-size:11px;padding:2px 8px;border-radius:10px;background:var(--panel-2);border:1px solid var(--border);color:var(--text-2);cursor:pointer;transition:all .15s;user-select:none}
  .filter-chip:hover{background:var(--hover);color:var(--text)}
  .filter-chip.active{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
  .work-block{margin-bottom:4px}
  .work-header{display:flex;align-items:center;gap:6px;padding:7px 8px;border-radius:7px;cursor:pointer;font-size:13px;transition:background .15s}
  .work-header:hover{background:var(--hover)}
  .work-header.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
  .work-icon{font-size:13px}
  .work-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chapter-list{padding-left:8px;margin-top:2px}
  .chapter-item{display:flex;align-items:center;gap:4px;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:12.5px;color:var(--text-2);transition:background .15s;margin-bottom:1px}
  .chapter-item:hover{background:var(--hover);color:var(--text)}
  .chapter-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
  .chapter-item.dragging{opacity:.4}
  .chapter-item.drag-over{border-top:2px solid var(--accent)}
  .chapter-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .drag-handle{color:var(--text-3);cursor:grab;font-size:11px;padding:0 2px;opacity:.5}
  .list-header{display:flex;align-items:center;justify-content:space-between;padding:4px 8px 10px;font-size:12px;color:var(--text-3);font-weight:600;letter-spacing:.3px}
  .char-item{display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px;cursor:pointer;transition:background .15s}
  .char-item:hover{background:var(--hover)}
  .char-avatar{width:32px;height:32px;border-radius:8px;flex-shrink:0;background:linear-gradient(135deg,var(--accent),#8b7bff);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;overflow:hidden}
  .char-avatar img{width:100%;height:100%;object-fit:cover}
  .char-info{flex:1;min-width:0}
  .char-name{font-size:13px;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .char-tags{display:flex;gap:3px;flex-wrap:wrap}
  .tag{font-size:10px;padding:1px 6px;border-radius:4px;background:var(--accent-soft);color:var(--accent)}
  .setting-item{padding:8px;border-radius:7px;cursor:pointer;transition:background .15s;display:flex;align-items:center;gap:8px}
  .setting-item:hover{background:var(--hover)}
  .setting-cat{font-size:10px;padding:1px 6px;border-radius:4px;background:var(--panel-2);color:var(--text-3);border:1px solid var(--border);flex-shrink:0}
  .setting-name{font-size:13px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .event-item{padding:8px;border-radius:7px;cursor:pointer;transition:background .15s;display:flex;align-items:center;gap:8px;border-left:2px solid var(--accent)}
  .event-item:hover{background:var(--hover)}
  .event-time{font-size:10.5px;color:var(--text-3);flex-shrink:0;min-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .event-title{font-size:13px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .clue-item{padding:8px 10px;border-radius:7px;cursor:pointer;transition:background .15s;border-left:3px solid var(--warn);margin-bottom:5px;background:var(--panel-2)}
  .clue-item:hover{background:var(--hover)}
  .clue-item.pending{border-left-color:var(--accent)}
  .clue-item.resolved{border-left-color:var(--success);opacity:.8}
  .clue-item.abandoned{border-left-color:var(--text-3);opacity:.55}
  .clue-item .clue-title{font-size:13px;font-weight:500;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:6px}
  .clue-item .clue-meta{font-size:11px;color:var(--text-3);display:flex;gap:6px;flex-wrap:wrap}
  .clue-status{font-size:10px;padding:1px 6px;border-radius:4px;background:var(--panel);border:1px solid var(--border);flex-shrink:0;font-weight:500}
  .clue-status.planted{color:var(--warn);border-color:var(--warn)}
  .clue-status.pending{color:var(--accent);border-color:var(--accent)}
  .clue-status.resolved{color:var(--success);border-color:var(--success)}
  .clue-status.abandoned{color:var(--text-3)}
  .material-item{padding:8px 10px;border-radius:7px;cursor:pointer;transition:background .15s;margin-bottom:5px;border:1px solid var(--border)}
  .material-item:hover{background:var(--hover)}
  .material-item .mat-title{font-size:13px;font-weight:500;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .material-item .mat-snippet{font-size:11.5px;color:var(--text-3);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.55}
  .empty-state,.empty-hint{text-align:center;color:var(--text-3);font-size:12px;padding:24px 12px;line-height:1.8}
  .empty-hint{padding:8px 12px;font-size:11.5px}
  .editor-wrap{flex:1;display:flex;flex-direction:column;background:var(--panel);overflow:hidden;min-width:0}
  .chapter-title{max-width:var(--page-width);width:100%;margin:0 auto;padding:28px 40px 4px;font-size:22px;font-weight:600;font-family:inherit;background:transparent;border:none;outline:none;color:var(--text);flex-shrink:0}
  .chapter-title::placeholder{color:var(--text-3);font-weight:400}
  .chapter-summary{max-width:var(--page-width);width:100%;margin:0 auto;padding:0 40px 4px;font-size:12px;font-family:inherit;background:transparent;border:none;outline:none;color:var(--text-3);flex-shrink:0;border-bottom:1px dashed transparent;transition:border-color .15s,color .15s}
  .chapter-summary:focus{color:var(--text-2);border-bottom-color:var(--border)}
  .chapter-summary::placeholder{color:var(--text-3)}
  .editor-container{flex:1;max-width:var(--page-width);width:100%;margin:0 auto;padding:0 40px 32px;display:flex;overflow:hidden}
  #editor{flex:1;width:100%;resize:none;border:none;outline:none;background:transparent;color:var(--text);font-family:inherit;font-size:var(--font-size);line-height:var(--line-height);letter-spacing:.02em;overflow-y:auto;padding-top:8px}
  #editor::placeholder{color:var(--text-3)}
  .preview{flex:1;overflow-y:auto;font-size:var(--font-size);line-height:var(--line-height);color:var(--text);padding-top:8px;display:none;letter-spacing:.02em}
  .preview.active{display:block}
  .preview h1{font-size:1.6em;margin:1em 0 .5em}
  .preview h2{font-size:1.35em;margin:1em 0 .5em}
  .preview h3{font-size:1.15em;margin:1em 0 .5em}
  .preview p{margin:0 0 .9em}
  .preview ul{margin:0 0 .9em 1.4em}
  .preview li{margin-bottom:.3em}
  .preview blockquote{border-left:3px solid var(--accent);padding-left:14px;color:var(--text-2);margin:0 0 .9em;font-style:italic}
  .preview code{background:var(--panel-2);padding:2px 6px;border-radius:4px;font-family:ui-monospace,"SF Mono",Consolas,monospace;font-size:.9em}
  .preview .wikilink{color:var(--accent);background:var(--accent-soft);padding:1px 6px;border-radius:4px;cursor:pointer;font-size:.95em;transition:background .15s}
  .preview .wikilink:hover{text-decoration:underline}
  .preview .wikilink.alias{text-decoration:underline dotted;text-underline-offset:3px}
  .preview table{border-collapse:collapse;margin:0 0 1em;width:100%;font-size:.95em}
  .preview th,.preview td{border:1px solid var(--border);padding:6px 10px;text-align:left}
  .preview th{background:var(--panel-2);font-weight:600}
  .preview .task-list{list-style:none;margin-left:0}
  .preview .task-list li{display:flex;align-items:flex-start;gap:6px}
  .preview .task-list input[type=checkbox]{margin-top:6px;accent-color:var(--accent)}
  .preview .task-list li.done{color:var(--text-3);text-decoration:line-through}
  .rightbar{width:210px;flex-shrink:0;background:var(--panel);border-left:1px solid var(--border);overflow-y:auto;padding:14px 12px}
  .right-section{margin-bottom:22px}
  .right-title{font-size:11px;font-weight:700;color:var(--text-3);letter-spacing:.6px;text-transform:uppercase;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
  .right-title .toggle{font-size:10px;color:var(--accent);cursor:pointer;font-weight:500;text-transform:none;letter-spacing:0}
  .right-title .toggle:hover{text-decoration:underline}
  .stat-row{display:flex;justify-content:space-between;font-size:12.5px;color:var(--text-2);padding:4px 0}
  .stat-row b{color:var(--text);font-weight:600}
  .char-chip{font-size:12.5px;padding:6px 10px;border-radius:7px;background:var(--panel-2);border:1px solid var(--border);margin-bottom:5px;cursor:pointer;transition:all .15s;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .char-chip:hover{background:var(--hover)}
  .char-chip.linked{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
  .char-chip .muted{color:var(--text-3);font-size:11px}
  .char-chip .alias-mark{color:var(--text-3);font-size:10.5px;margin-left:3px}
  .outline-list{font-size:12px}
  .outline-item{padding:4px 8px;border-radius:5px;cursor:pointer;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:background .15s;margin-bottom:1px}
  .outline-item:hover{background:var(--hover);color:var(--text)}
  .outline-item.h1{font-weight:700;color:var(--text)}
  .outline-item.h2{padding-left:10px}
  .outline-item.h3{padding-left:22px;font-size:11.5px;color:var(--text-3)}
  .goal-box{margin-bottom:6px}
  .goal-head{display:flex;justify-content:space-between;font-size:11.5px;color:var(--text-2);margin-bottom:5px}
  .goal-head b{color:var(--text);font-weight:600}
  .goal-bar{height:6px;background:var(--panel-2);border:1px solid var(--border);border-radius:4px;overflow:hidden}
  .goal-fill{height:100%;background:var(--accent);transition:width .3s,background .3s;border-radius:3px}
  .goal-fill.done{background:var(--success)}
  .goal-edit{font-size:11px;color:var(--accent);cursor:pointer;text-decoration:none;user-select:none}
  .goal-edit:hover{text-decoration:underline}
  .statusbar{height:28px;flex-shrink:0;display:flex;align-items:center;gap:18px;padding:0 16px;font-size:11.5px;color:var(--text-3);border-top:1px solid var(--border);background:var(--panel)}
  .statusbar .tw-indicator{color:var(--accent)}
  body.focus .sidebar,body.focus .rightbar{display:none}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:100;padding:24px;backdrop-filter:blur(2px)}
  .modal-overlay.active{display:flex}
  .modal{background:var(--panel);border-radius:14px;width:100%;max-width:520px;max-height:88vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.25);animation:modalIn .18s ease}
  .modal.wide{max-width:760px}
  @keyframes modalIn{from{opacity:0;transform:scale(.97) translateY(6px)}to{opacity:1;transform:none}}
  .modal-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 12px;flex-shrink:0;gap:8px}
  .modal-header h3{font-size:15px;font-weight:600}
  .modal-body{padding:0 20px;overflow-y:auto;flex:1}
  .modal-actions{display:flex;gap:8px;justify-content:flex-end;padding:16px 20px;flex-shrink:0;border-top:1px solid var(--border);margin-top:12px;flex-wrap:wrap}
  .modal-text{color:var(--text-2);font-size:13.5px;line-height:1.7;padding:4px 0 8px}
  .form-label{display:block;font-size:12px;color:var(--text-2);margin:12px 0 5px;font-weight:500}
  .modal-input,.modal-textarea,.modal-select{width:100%;background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:9px 12px;font-size:13.5px;color:var(--text);outline:none;font-family:inherit;transition:border-color .15s}
  .modal-input:focus,.modal-textarea:focus,.modal-select:focus{border-color:var(--accent)}
  .modal-textarea{resize:vertical;min-height:80px;line-height:1.7}
  .field-row{display:flex;gap:6px;margin-bottom:6px;align-items:center}
  .field-row .key{flex:0 0 88px}
  .field-row .val{flex:1}
  .field-row .icon-btn{opacity:1;flex-shrink:0}
  .char-fields-head{display:flex;align-items:center;justify-content:space-between;margin:18px 0 8px}
  .char-fields-head span{font-size:12px;color:var(--text-2);font-weight:500}
  .rel-item{margin-bottom:8px;padding-bottom:8px;border-bottom:1px dashed var(--border)}
  .rel-item:last-child{border-bottom:none}
  .rel-row{display:flex;gap:6px;align-items:center;margin-bottom:6px}
  .rel-row .icon-btn{opacity:1;flex-shrink:0}
  .rel-target{flex:1}
  .rel-type{flex:1}
  .rel-note{width:100%}

  .search-input-wrap{display:flex;align-items:center;gap:8px;padding:12px 20px;border-bottom:1px solid var(--border);flex-shrink:0}

  .check-list{margin:0}

  .check-item .meta{font-size:11.5px;color:var(--text-3);margin-left:8px}
  .check-item .actions{display:flex;gap:4px}

  .tpl-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 4px}

  .tpl-card .tpl-del{position:absolute;top:8px;right:8px;opacity:.5;font-size:12px;cursor:pointer}

  .replace-row{display:flex;gap:8px;padding:10px 20px;flex-shrink:0}

  .replace-scope{display:flex;gap:8px;padding:0 20px 12px;flex-wrap:wrap;align-items:center}

  .replace-results{flex:1;overflow-y:auto;padding:0 12px 12px;font-size:12.5px}
  .replace-group{margin-bottom:10px}
  .replace-group-title{font-size:11px;font-weight:700;color:var(--text-3);letter-spacing:.6px;text-transform:uppercase;padding:8px 8px 6px}
  .replace-hit{padding:6px 10px;border-radius:6px;background:var(--panel-2);border:1px solid var(--border);margin-bottom:4px;line-height:1.6;color:var(--text-2);word-break:break-all}
  .replace-hit mark{background:var(--accent-soft);color:var(--accent);border-radius:2px;padding:0 2px;font-weight:600}
  .replace-actions{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--border);flex-shrink:0}
  .replace-count{font-size:12.5px;color:var(--text-2);padding:0 20px 8px}
  .replace-count b{color:var(--accent);font-weight:600}
  .hover-card{position:fixed;z-index:150;background:var(--panel);border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 32px rgba(0,0,0,.18);padding:12px 14px;min-width:220px;max-width:280px;font-size:12.5px;line-height:1.65;pointer-events:none;opacity:0;transition:opacity .12s;color:var(--text)}

  .hover-card .hc-avatar{width:36px;height:36px;border-radius:8px;flex-shrink:0;background:linear-gradient(135deg,var(--accent),#8b7bff);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;overflow:hidden}
  .hover-card .hc-avatar img{width:100%;height:100%;object-fit:cover}
  .hover-card .hc-name{font-weight:600;font-size:13.5px}
  .hover-card .hc-alias{font-size:11px;color:var(--text-3);margin-top:2px}
  .hover-card .hc-fields{font-size:12px;color:var(--text-2)}
  .hover-card .hc-field{margin-bottom:3px}
  .hover-card .hc-field b{color:var(--text);font-weight:600}
  .hover-card .hc-tags{display:flex;gap:3px;flex-wrap:wrap;margin-top:6px}
  .hover-card .hc-hint{font-size:10.5px;color:var(--text-3);margin-top:8px;text-align:center}
  .help-section{margin-bottom:18px}
  .help-section h4{font-size:13.5px;font-weight:700;color:var(--text);margin-bottom:8px;display:flex;align-items:center;gap:6px}

  .help-section li{margin-bottom:3px}
  .help-section code{background:var(--panel-2);border:1px solid var(--border);padding:1px 6px;border-radius:4px;font-family:ui-monospace,"SF Mono",Consolas,monospace;font-size:12px;color:var(--accent)}
  .help-tip{background:var(--accent-soft);border-left:3px solid var(--accent);padding:10px 14px;border-radius:6px;font-size:12.5px;color:var(--text-2);line-height:1.75;margin:10px 0}
  .help-kbd{display:inline-block;background:var(--panel-2);border:1px solid var(--border);border-bottom-width:2px;padding:1px 6px;border-radius:4px;font-family:ui-monospace,monospace;font-size:11.5px;color:var(--text)}
  .snap-item{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-radius:7px;background:var(--panel-2);border:1px solid var(--border);margin-bottom:5px;font-size:12.5px}
  .snap-item .snap-name{font-weight:500;margin-bottom:3px}
  .snap-item .snap-meta{font-size:11px;color:var(--text-3)}
  .snap-item .snap-actions{display:flex;gap:4px;flex-shrink:0}

  /* ============ 移动端/平板适配 ============ */
  .mobile-only { display: none !important; }
  .mobile-menu {
    display: none;
    position: fixed;
    top: 54px;
    right: 8px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 8px 32px rgba(0,0,0,.18);
    z-index: 95;
    padding: 6px;
    min-width: 170px;
    max-height: 70vh;
    overflow-y: auto;
  }
  .mobile-menu.show { display: block; }
  .mobile-menu button {
    display: block;
    width: 100%;
    background: transparent;
    border: none;
    text-align: left;
    padding: 10px 14px;
    font-size: 13.5px;
    color: var(--text);
    cursor: pointer;
    font-family: inherit;
    border-radius: 6px;
    white-space: nowrap;
  }
  .mobile-menu button:hover,
  .mobile-menu button:active { background: var(--hover); }
  .drawer-mask {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.4);
    z-index: 80;
    opacity: 0;
    transition: opacity .2s;
  }
  body.drawer-left .drawer-mask,
  body.drawer-right .drawer-mask {
    display: block;
    opacity: 1;
  }

  /* 平板：保留三栏但收窄 */

    .rightbar { width: 180px; }
    .topbar { padding: 0 10px; }
    .topbar-right { gap: 4px; }
    .topbar-right .btn { padding: 5px 9px; font-size: 12px; }
    #btnTypewriter, #btnFocus, #btnImport, #btnHelp { display: none; }
    .mobile-only { display: none !important; }
  }

  /* 手机 */

    .topbar { padding: 0 8px; gap: 6px; }
    .logo { display: none; }
    .work-select { max-width: 110px; font-size: 12px; padding: 4px 8px; }
    .save-status { display: none; }
    .topbar-left { gap: 4px; min-width: 0; flex: 1; }
    .topbar-right { gap: 4px; flex-shrink: 0; }
    .topbar-right .btn { padding: 5px 9px; font-size: 13px; }
    #btnSearch, #btnReplace, #btnStats, #btnTypewriter, #btnFocus,
    #btnExport, #btnImport, #btnHelp, #btnRevision, #btnSettings { display: none; }
    .mobile-only { display: inline-flex !important; }
    .sidebar {
      position: fixed;
      left: 0;
   top: calc(var(--gbar-h, 46px) + 48px);
      bottom: 0;
      width: 82%;

      transform: translateX(-100%);

      box-shadow: 2px 0 24px rgba(0,0,0,.15);
    }

    .rightbar {
      position: fixed;
      right: 0;
    top: calc(var(--gbar-h, 46px) + 48px);
      bottom: 0;
      width: 82%;
      max-width: 320px;
      z-index: 90;
      transform: translateX(100%);
      transition: transform .25s ease;
      box-shadow: -2px 0 24px rgba(0,0,0,.15);
    }
    body.drawer-right .rightbar { transform: translateX(0); }
    .editor-wrap { width: 100%; }
    .chapter-title { padding: 16px 18px 4px; font-size: 20px; }
    .chapter-summary { padding: 0 18px 4px; font-size: 11.5px; }
    .editor-container { padding: 0 18px 24px; }
    :root { --page-width: 100%; }
    .statusbar { padding: 0 12px; gap: 12px; font-size: 11px; }
    .icon-btn { opacity: 1 !important; padding: 6px 10px; font-size: 16px; }
    .chapter-item { padding: 10px 8px; }
    .char-item, .setting-item, .event-item { padding: 10px 8px; }

        .tabs { padding: 6px; }
      .tabs { padding: 8px 6px; }

    .modal.wide { max-width: 100%; }

    .btn { padding: 8px 14px; }

  /* ============ 修订模式 ============ */
  .revision-view {
    flex: 1;
    width: 100%;
    overflow-y: auto;
    padding-top: 8px;
    display: none;
    font-family: inherit;
    font-size: var(--font-size);
    line-height: var(--line-height);
    letter-spacing: .02em;
    white-space: pre-wrap;
    word-break: break-word;
    color: var(--text);
  }
  .revision-view.active { display: block; }
  .revision-view .rev-toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    padding: 8px 12px;
    margin-bottom: 12px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 12.5px;
    color: var(--text-2);
    position: sticky;
    top: 0;
    z-index: 5;
  }
  .revision-view .rev-stat-add { color: var(--success); font-weight: 600; }
  .revision-view .rev-stat-del { color: var(--danger); font-weight: 600; }
  .revision-view .rev-toolbar .btn { padding: 4px 10px; font-size: 12px; }
  .revision-view .rev-body { padding: 4px 0 32px; }
  .rev-del {
    background: rgba(255, 91, 91, .15);
    color: var(--danger);
    text-decoration: line-through;
    padding: 0 2px;
    border-radius: 2px;
  }
  .rev-ins {
    background: rgba(62, 207, 142, .15);
    color: var(--success);
    text-decoration: underline;
    text-decoration-color: var(--success);
    padding: 0 2px;
    border-radius: 2px;
  }
  .rev-item-mark {
    font-size: 9px;
    color: var(--warn);
    background: rgba(232, 160, 92, .15);
    padding: 0 4px;
    border-radius: 3px;
    margin-left: 4px;
    font-weight: 600;
    vertical-align: middle;
  }

  /* 界面缩放 */
  body { zoom: var(--ui-scale, 1); }

    display: none;
    position: fixed;
    top: 54px;
    right: 14px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 8px 32px rgba(0,0,0,.18);
    z-index: 95;
    padding: 16px;
    width: 280px;
  }
  .settings-panel.show { display: block; }
  .settings-panel h4 {
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 14px;
    color: var(--text);
  }
  .settings-row {
    margin-bottom: 14px;
  }
  .settings-row label {
    display: flex;
    justify-content: space-between;
    font-size: 12px;

  .settings-row input[type=range] {

  /* ============ 小黑屋 ============ */
  .lockdown-bar {
    display: none;
    align-items: center;
    gap: 14px;
    flex: 1;
    justify-content: center;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--accent);
  }
  body.lockdown .lockdown-bar { display: flex; }
  body.lockdown .save-status { display: none; }
  body.lockdown .topbar-left { display: none; }
  body.lockdown .topbar-right .btn { display: none; }
    #btnEmergency { display: none; }
  body.lockdown .topbar-right #btnEmergency { display: inline-flex !important; }
  body.lockdown .sidebar,
  body.lockdown .rightbar,
  body.lockdown .resizer { display: none !important; }
  body.lockdown .chapter-title,
  body.lockdown .chapter-summary { pointer-events: none; opacity: .6; }
  /* 侧栏折叠 */
  .sidebar.collapsed {
    width: 0 !important;
    min-width: 0;
    overflow: hidden;
    border-right: none;
  }
  .sidebar.collapsed .tabs,
  .sidebar.collapsed .tab-content {
    display: none;
  }
  /* 拖动条加宽 */
  .resizer {
    width: 8px;
  }
  .resizer::before {
    width: 3px;
    height: 48px;
  }
  .resizer:hover::before {
    height: 90px;
    width: 3px;
  }
  /* ============ 侧栏拖动 ============ */
  .resizer {
    width: 8px;
    flex-shrink: 0;
    cursor: col-resize;
    background: transparent;
    position: relative;
    z-index: 10;
    transition: background .15s;
    user-select: none;
  }
  .resizer:hover,
  .resizer.dragging {
    background: var(--accent-soft);
  }
  .resizer::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 2px;
    height: 32px;
    background: var(--border);
    border-radius: 2px;
    transition: background .15s, height .15s;
  }
  .resizer:hover::before,
  .resizer.dragging::before {
    background: var(--accent);
    height: 60px;
  }
  @media (max-width: 768px) {
    .resizer { display: none; }
  }
  
/* ============ 删稿回收站 ============ */

  .btn {

  .btn.primary:hover {

<script>
/* ============================================================
   1. 常量与状态
============================================================ */
const STORAGE_KEY='writer-app-v1';
const PREFS_KEY='writer-app-prefs-v1';
const CLUE_STATUSES={
  planted:{label:'已埋设',cls:'planted'},
  pending:{label:'待回收',cls:'pending'},
  resolved:{label:'已回收',cls:'resolved'},
  abandoned:{label:'已废弃',cls:'abandoned'},
};
const CHAPTER_TEMPLATES=[
  {id:'blank',name:'空白',desc:'从零开始',content:''},
  {id:'three',name:'三幕结构',desc:'开场 / 发展 / 高潮 / 收尾',content:'## 开场\n\n\n## 发展\n\n\n## 高潮\n\n\n## 收尾\n\n'},
  {id:'scene',name:'场景卡',desc:'地点、人物、目标、冲突、结果',content:'### 场景一\n\n- 地点：\n- 人物：\n- 目标：\n- 冲突：\n- 结果：\n\n'},
  {id:'dialogue',name:'对话稿',desc:'以对话为主，含旁白提示',content:'> 场景：\n\n**A：**\n\n\n**B：**\n\n'},
  {id:'outline',name:'剧情大纲',desc:'分节列出关键情节点',content:'## 本章目标\n\n\n## 关键情节\n\n- \n- \n- \n\n## 结尾钩子\n\n'},
];

let state={
  works:[],characters:[],settings:[],events:[],clues:[],materials:[],
  trash:[],ideas:[],templates:[],dailyStats:{},currentWorkId:null,currentChapterId:null,
};

let prefs={
  theme:'light',focus:false,tab:'works',preview:false,revisionView:false,
  fontSize:18,lineHeight:2.0,pageWidth:960,dailyGoal:1000,
  typewriter:false,outlineCollapsed:false,
    sidebarWidth:240,rightbarWidth:210,
  pomodoro:{ workMin:25, restMin:5, workSec:1500, restSec:300, soundEnabled:true },
  accentColor:'#6366f1',
  lockdown:{
    active:false,
    startTime:0,
    startWords:0,
    targetWords:0,
    targetMinutes:0,
    password:'8888',
  },
};

let filterTags={characters:[],settings:[]};
let _lastTotalWords=null;
let dragChapterId=null;

/* ============================================================
   2. 工具函数
============================================================ */
const $=s=>document.querySelector(s);
const $$=s=>document.querySelectorAll(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const escapeRegExp=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');

function countWords(text){
  if(!text)return 0;
  return text.replace(/\s+/g,'').replace(/[#*>`_~\[\]\(\)\-]/g,'').length;
}
function dateKey(d){
  const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),dd=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${dd}`;
}
function todayKey(){return dateKey(new Date());}
function fmtTime(ts){
  const d=new Date(ts);
  const now=new Date();
  const diff=(now-d)/1000;
  if(diff<60)return '刚刚';
  if(diff<3600)return Math.floor(diff/60)+' 分钟前';
  if(diff<86400)return Math.floor(diff/3600)+' 小时前';
  if(diff<86400*7)return Math.floor(diff/86400)+' 天前';
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function download(filename,content,type='text/plain'){
  const blob=new Blob([content],{type:type+';charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=filename;
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function toast(msg){
  const el=document.createElement('div');
  el.className='toast';el.textContent=msg;
  document.body.appendChild(el);
  requestAnimationFrame(()=>el.classList.add('show'));
  setTimeout(()=>{el.classList.remove('show');setTimeout(()=>el.remove(),300);},2400);
}
const getWork=()=>state.works.find(w=>w.id===state.currentWorkId);
const getChapter=()=>{const w=getWork();return w?w.chapters.find(c=>c.id===state.currentChapterId):null;};
function getAllWords(){return state.works.reduce((s,w)=>s+w.chapters.reduce((a,c)=>a+countWords(c.content),0),0);}
function getAllTags(list,key){return[...new Set(list.flatMap(x=>x[key]||[]))].sort();}
function highlight(text,q){
  if(!q)return esc(text);
  const re=new RegExp(escapeRegExp(q),'gi');
  return esc(text).replace(re,m=>`<mark>${m}</mark>`);
}
function resolveCharName(name){
  if(!name)return name;
  const n=String(name).trim();
  const exact=state.characters.find(c=>c.name===n);
  if(exact)return exact.name;
  const byAlias=state.characters.find(c=>(c.aliases||[]).includes(n));
  if(byAlias)return byAlias.name;
  return n;
}
function findCharCard(name){
  const resolved=resolveCharName(name);
  return state.characters.find(c=>c.name===resolved);
}
function findCharacterAppearances(char){
  const names=new Set([char.name,...(char.aliases||[])].filter(Boolean));
  const hits=[];
  state.works.forEach(w=>w.chapters.forEach(ch=>{
    const re=/\[\[(.+?)\]\]/g;let m;
    const matched=new Set();
    while((m=re.exec(ch.content))){
      const n=m[1].trim();
      if(names.has(n)&&!matched.has(n))matched.add(n);
    }
    if(matched.size>0){
      hits.push({
        workId:w.id,workTitle:w.title,
        chapterId:ch.id,chapterTitle:ch.title,
        via:[...matched].join('、'),
      });
    }
  }));
  return hits;
}
function extractOutline(content){
  if(!content)return [];
  const items=[];
  content.split('\n').forEach((line,idx)=>{
    const m=line.match(/^(#{1,3})\s+(.+)$/);
    if(m)items.push({level:m[1].length,text:m[2].trim(),lineIdx:idx});
  });
  return items;
}
function jumpToLine(lineIdx){
  const ta=$('#editor');
  if(prefs.preview||prefs.revisionView){
    prefs.preview=false;
    prefs.revisionView=false;
    saveNow();render();
  }
  const content=ta.value;
  const lines=content.split('\n');
  let charIdx=0;
  for(let i=0;i<lineIdx&&i<lines.length;i++)charIdx+=lines[i].length+1;
  ta.focus();
  ta.setSelectionRange(charIdx,charIdx+(lines[lineIdx]?.length||0));
}
function findChapterById(cid){
  for(const w of state.works){
    const c=w.chapters.find(ch=>ch.id===cid);
    if(c)return {...c,workTitle:w.title,workId:w.id};
  }
  return null;
}

/* ============================================================
   3. 写作统计
============================================================ */
function recordWords(){
  const total=getAllWords();
  if(_lastTotalWords===null){_lastTotalWords=total;return;}
  const delta=total-_lastTotalWords;
  if(delta>0){
    const k=todayKey();
    state.dailyStats[k]=(state.dailyStats[k]||0)+delta;
  }
  _lastTotalWords=total;
}
const getTodayWords=()=>state.dailyStats[todayKey()]||0;
function getWeekWords(){
  const t=new Date();t.setHours(0,0,0,0);
  const dow=t.getDay()||7;
  const mon=new Date(t);mon.setDate(t.getDate()-(dow-1));
  let s=0;
  for(let d=new Date(mon);d<=t;d.setDate(d.getDate()+1))s+=state.dailyStats[dateKey(d)]||0;
  return s;
}
function getMonthWords(){
  const t=new Date();t.setHours(0,0,0,0);
  const first=new Date(t.getFullYear(),t.getMonth(),1);
  let s=0;
  for(let d=new Date(first);d<=t;d.setDate(d.getDate()+1))s+=state.dailyStats[dateKey(d)]||0;
  return s;
}
function getStreak(){
  let s=0;
  const d=new Date();d.setHours(0,0,0,0);
  if(!state.dailyStats[dateKey(d)])d.setDate(d.getDate()-1);
  while(state.dailyStats[dateKey(d)]>0){s++;d.setDate(d.getDate()-1);if(s>3650)break;}
  return s;
}
function renderHeatmap(){
  const weeks=20;
  const today=new Date();today.setHours(0,0,0,0);
  const dow=today.getDay();
  const start=new Date(today);
  start.setDate(today.getDate()-dow-(weeks-1)*7);
  const cells=[];
  for(let i=0;i<weeks*7;i++){
    const d=new Date(start);d.setDate(start.getDate()+i);
    const k=dateKey(d);const v=state.dailyStats[k]||0;const future=d>today;
    let lv=0;
    if(!future&&v>0){if(v<300)lv=1;else if(v<1000)lv=2;else if(v<2500)lv=3;else lv=4;}
    cells.push(`<div class="hm-cell lv${lv}" title="${k}：${v} 字"></div>`);
  }
  return `<div class="heatmap">${cells.join('')}</div>
    <div class="hm-legend"><span>少</span>
    <div class="hm-cell"></div><div class="hm-cell lv1"></div>
    <div class="hm-cell lv2"></div><div class="hm-cell lv3"></div>
    <div class="hm-cell lv4"></div><span>多</span></div>`;
}

/* ============================================================
   4. 持久化
============================================================ */
function saveNow(){
  try{
    localStorage.setItem(STORAGE_KEY,JSON.stringify(state));
    localStorage.setItem(PREFS_KEY,JSON.stringify(prefs));
  }catch(e){
    setStatus('保存失败');
    console.warn(e);
  }
}
let saveTimer;
function scheduleSave(){
  setStatus('未保存');
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{saveNow();setStatus('已保存');},700);
}
function setStatus(s){const el=$('#saveStatus');if(el)el.textContent=s;}

function migrate(){
  if(!state.dailyStats)state.dailyStats={};
  if(!state.events)state.events=[];
  if(!state.templates)state.templates=[];
  if(!state.clues)state.clues=[];
  if(!state.materials)state.materials=[];
  if(!state.trash)state.trash=[];
  if(!state.ideas)state.ideas=[];
  (state.ideas||[]).forEach(it=>{
    if(!it.scope)it.scope='chapter';
    if(it.rangeFrom===undefined)it.rangeFrom=null;
    if(it.rangeTo===undefined)it.rangeTo=null;
    if(!it.usedIn)it.usedIn=[];
    if(!it.tags)it.tags=[];
  });
  state.works.forEach(w=>{
    if(!w.snapshots)w.snapshots=[];
    (w.chapters||[]).forEach(c=>{
      if(c.summary===undefined)c.summary='';
      if(c.wordGoal===undefined)c.wordGoal=0;
      if(c.revisionBase===undefined)c.revisionBase=null;
    });
  });
  (state.characters||[]).forEach(c=>{
    if(!c.relations)c.relations=[];
    if(!c.tags)c.tags=[];
    if(!c.aliases)c.aliases=[];
    if(c.avatar===undefined)c.avatar='';
    if(!c.fields)c.fields=[];
  });
  (state.settings||[]).forEach(s=>{
    if(!s.tags)s.tags=[];
    if(s.content===undefined)s.content='';
  });
  (state.events||[]).forEach(ev=>{
    if(!ev.tags)ev.tags=[];
    if(!ev.characters)ev.characters=[];
    if(ev.description===undefined)ev.description='';
  });
  (state.clues||[]).forEach(cl=>{
    if(!cl.tags)cl.tags=[];
    if(!cl.status)cl.status='planted';
    if(cl.description===undefined)cl.description='';
    if(cl.plantedChapter===undefined)cl.plantedChapter=null;
    if(cl.plannedResolve===undefined)cl.plannedResolve=null;
  });
  (state.materials||[]).forEach(m=>{
    if(!m.tags)m.tags=[];
    if(!m.category)m.category='灵感';
    if(m.content===undefined)m.content='';
  });
  if(typeof prefs.dailyGoal!=='number')prefs.dailyGoal=1000;
  if(typeof prefs.typewriter!=='boolean')prefs.typewriter=false;
  if(typeof prefs.outlineCollapsed!=='boolean')prefs.outlineCollapsed=false;
  if(typeof prefs.revisionView!=='boolean')prefs.revisionView=false;
}

function loadAll(){
  try{const s=localStorage.getItem(STORAGE_KEY);if(s)state=Object.assign(state,JSON.parse(s));}catch(e){console.warn(e);}
  try{const p=localStorage.getItem(PREFS_KEY);if(p)prefs=Object.assign(prefs,JSON.parse(p));}catch(e){console.warn(e);}
  if(!state.works.length)initSample();
  migrate();
  if(!state.works.find(w=>w.id===state.currentWorkId))state.currentWorkId=state.works[0].id;
  const w=getWork();
  if(!w.chapters.find(c=>c.id===state.currentChapterId))state.currentChapterId=w.chapters[0]?.id||null;
  _lastTotalWords=getAllWords();
}

function initSample(){
  const wid=uid();
  state.works=[{
    id:wid,title:'我的写作本',type:'fanfic',
    chapters:[{
      id:uid(),title:'第一章',summary:'开场，介绍主要角色',
      content:`欢迎使用写作台。

**最新版新增**
- 大纲面板 / 版本快照 / 线索追踪 / 素材库
- 打字机模式 / 章节模板 / 修订模式
- 外观设置：字号、行距、正文宽度
- 手机和平板适配
- Markdown 表格 / 待办

**表格示例**
| 角色 | 阵营 | 状态 |
|---|---|---|
| 甲 | 光明 | 存活 |
| 乙 | 暗影 | 失踪 |

**待办示例**
- [x] 设计第一章
- [ ] 补完人物关系
- [ ] 埋下伏笔

写点什么吧。`,
      updatedAt:Date.now(),
    }],
    snapshots:[],
    createdAt:Date.now(),
  }];
  state.currentWorkId=wid;
  state.currentChapterId=state.works[0].chapters[0].id;
  state.characters=[];
  state.settings=[];
  state.events=[];
  state.clues=[];
  state.materials=[];
  state.templates=[];
  state.dailyStats={};
}

/* ============================================================
   5. 渲染主流程
============================================================ */
function render(){
  document.documentElement.setAttribute('data-theme',prefs.theme);
  applyAccent(prefs.accentColor);
  document.documentElement.style.setProperty('--font-size',prefs.fontSize+'px');
  document.documentElement.style.setProperty('--line-height',prefs.lineHeight);
  document.documentElement.style.setProperty('--page-width',prefs.pageWidth+'px');
  document.body.classList.toggle('focus',prefs.focus);
  $('#btnTheme').textContent=prefs.theme==='dark'?'☀️':'🌙';
    $('#btnPreview').title = prefs.preview ? '返回编辑' : '预览';
  $('#btnFocus').title = prefs.focus ? '退出专注' : '专注模式';
  $('#btnTypewriter').style.background=prefs.typewriter?'var(--accent-soft)':'';
  $('#btnTypewriter').style.borderColor=prefs.typewriter?'var(--accent)':'';
  $('#statusTw').style.display=prefs.typewriter?'':'none';

  const editorHidden = prefs.preview || prefs.revisionView;
  $('#editor').style.display = editorHidden ? 'none' : 'block';
  $('#preview').classList.toggle('active', prefs.preview && !prefs.revisionView);
  $('#revisionView').classList.toggle('active', prefs.revisionView);
  if (prefs.revisionView) renderRevisionView();

  renderWorkSelect();
  renderTab();
  renderRight();
  updateEditorMeta();
}

function renderWorkSelect(){
  $('#workSelect').innerHTML=state.works.map(w=>
    `<option value="${w.id}" ${w.id===state.currentWorkId?'selected':''}>${esc(w.title)}</option>`
  ).join('');
}

function renderTab(){
  $$('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===prefs.tab));
  const el=$('#tabContent');
  if(prefs.tab==='works')el.innerHTML=worksHTML();
  else if(prefs.tab==='characters')el.innerHTML=charactersHTML();
  else if(prefs.tab==='settings')el.innerHTML=settingsHTML();
  else if(prefs.tab==='timeline')el.innerHTML=timelineHTML();
  else if(prefs.tab==='clues')el.innerHTML=cluesHTML();
  else if(prefs.tab==='materials')el.innerHTML=materialsHTML();
  else if(prefs.tab==='ideas')el.innerHTML=ideasHTML();
    else if(prefs.tab==='trash')el.innerHTML=trashHTML();
}

function worksHTML(){
  if(!state.works.length)return '<div class="empty-state">还没有作品</div>';
  return state.works.map(w=>{
    const active=w.id===state.currentWorkId;
    return `
      <div class="work-block" data-work="${w.id}">
        <div class="work-header ${active?'active':''}" data-action="select-work">
          <span class="work-icon">${w.type==='fanfic'?'📖':'✒️'}</span>
          <span class="work-name">${esc(w.title)}</span>
          <button class="icon-btn" data-action="add-chapter" title="新建章节">＋</button>
          <button class="icon-btn" data-action="work-menu" title="更多">⋯</button>
        </div>
        ${active?`
          <div class="chapter-list">
            ${w.chapters.map(c=>`
              <div class="chapter-item ${c.id===state.currentChapterId?'active':''}"
                   draggable="true"
                   data-chapter="${c.id}" data-action="select-chapter"
                   title="${esc(c.summary||'')}">
                <span class="drag-handle" title="拖拽排序">⋮⋮</span>
                <span class="chapter-name">${esc(c.title||'未命名')}${c.revisionBase?'<span class="rev-item-mark">修订</span>':''}</span>
                <button class="icon-btn" data-action="chapter-menu" title="更多">⋯</button>
              </div>
            `).join('')}
            ${w.chapters.length===0?'<div class="empty-hint">暂无章节</div>':''}
          </div>
        `:''}
      </div>
    `;
  }).join('')+
  `<div style="padding:8px 8px 0">
    <button class="btn small" style="width:100%" data-action="new-work">＋ 新建作品</button>
  </div>`;
}

function renderFilterBar(list,scope){
  if(!list.length)return '';
  const active=filterTags[scope];
  return `<div class="filter-bar">
    <span class="filter-chip ${active.length===0?'active':''}" data-filter-scope="${scope}" data-filter-tag="">全部</span>
    ${list.map(t=>`<span class="filter-chip ${active.includes(t)?'active':''}" data-filter-scope="${scope}" data-filter-tag="${esc(t)}">${esc(t)}</span>`).join('')}
  </div>`;
}

function charactersHTML(){
  const allTags=getAllTags(state.characters,'tags');
  const active=filterTags.characters;
  const list=active.length?state.characters.filter(c=>(c.tags||[]).some(t=>active.includes(t))):state.characters;

 <div class="right-section">

      </div>      <div class="stat-row"><span>出场角色</span><b>${mentionedMap.size}</b></div>

/* ============================================================
   6. Markdown 预览
============================================================ */
function inlineMd(s){
  s=esc(s);
  s=s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  s=s.replace(/(^|[^*])\*([^*]+?)\*/g,'$1<em>$2</em>');
  s=s.replace(/~~(.+?)~~/g,'<del>$1</del>');
  s=s.replace(/==(.+?)==/g,'<mark>$1</mark>');
  s=s.replace(/\+\+(.+?)\+\+/g,'<u>$1</u>');
  s=s.replace(/`(.+?)`/g,'<code>$1</code>');
  s=s.replace(/\[\[(.+?)\]\]/g,(mm,name)=>{
    const raw=name.trim();
    const resolved=resolveCharName(raw);
    const usedAlias=resolved!==raw;
    return `<span class="wikilink ${usedAlias?'alias':''}" data-name="${esc(resolved)}" data-raw="${esc(raw)}" title="${usedAlias?'别名：'+esc(raw):esc(raw)}">${esc(resolved)}</span>`;
  });
  s=s.replace(/\{\{(.+?)\}\}/g,(mm,name)=>{
    return `<span class="idearef" title="点子：${esc(name)}">💡 ${esc(name.trim())}</span>`;
  });
  return s;
}function renderMarkdown(text){
  if(!text||!text.trim())return '<p style="color:var(--text-3)">暂无内容</p>';
  const lines=text.split('\n');
  const out=[];
  let inList=false,inTaskList=false,inTable=false,tableRows=[];
  const closeList=()=>{if(inList){out.push('</ul>');inList=false;}};
  const closeTask=()=>{if(inTaskList){out.push('</ul>');inTaskList=false;}};
  const closeTable=()=>{
    if(inTable){
      if(tableRows.length>0){
        const header=tableRows[0];
        const body=tableRows.length>2?tableRows.slice(2):[];
        out.push('<table>');
        out.push('<thead><tr>'+header.map(c=>`<th>${inlineMd(c)}</th>`).join('')+'</tr></thead>');
        if(body.length){
          out.push('<tbody>');
          body.forEach(row=>{
            out.push('<tr>'+row.map(c=>`<td>${inlineMd(c)}</td>`).join('')+'</tr>');
          });
          out.push('</tbody>');
        }
        out.push('</table>');
      }
      tableRows=[];
      inTable=false;
    }
  };
  const closeAll=()=>{closeList();closeTask();closeTable();};

  for(const line of lines){
    if(/^\s*\|.*\|\s*$/.test(line)){
      closeList();closeTask();
      inTable=true;
      const cells=line.trim().slice(1,-1).split('|').map(c=>c.trim());
      tableRows.push(cells);
      continue;
    }else{
      closeTable();
    }
    const taskMatch=line.match(/^[-*]\s+\[([ xX])\]\s+(.*)$/);
    if(taskMatch){
      closeList();
      if(!inTaskList){out.push('<ul class="task-list">');inTaskList=true;}
      const checked=taskMatch[1].toLowerCase()==='x';
      out.push(`<li class="${checked?'done':''}"><input type="checkbox" ${checked?'checked':''} disabled>${inlineMd(taskMatch[2])}</li>`);
      continue;
    }else{
      closeTask();
    }
    if(/^###\s+/.test(line)){closeList();out.push(`<h3>${inlineMd(line.slice(4))}</h3>`);}
    else if(/^##\s+/.test(line)){closeList();out.push(`<h2>${inlineMd(line.slice(3))}</h2>`);}
    else if(/^#\s+/.test(line)){closeList();out.push(`<h1>${inlineMd(line.slice(2))}</h1>`);}
    else if(/^>\s?/.test(line)){closeList();out.push(`<blockquote>${inlineMd(line.replace(/^>\s?/,''))}</blockquote>`);}
    else if(/^[-*]\s+/.test(line)){
      if(!inList){out.push('<ul>');inList=true;}
      out.push(`<li>${inlineMd(line.slice(2))}</li>`);
    }
    else if(/^---+\s*$/.test(line)){closeList();out.push('<hr>');}
    else if(!line.trim()){closeList();}
    else{closeList();out.push(`<p>${inlineMd(line)}</p>`);}
  }
  closeAll();
  return out.join('\n');
}
function renderPreview(){$('#preview').innerHTML=renderMarkdown($('#editor').value);}

   7. 打字机模式
============================================================ */
function centerCursor(){
  if(!prefs.typewriter)return;
  const ta=$('#editor');
  if(document.activeElement!==ta)return;
  const start=ta.selectionStart;
  const text=ta.value;
  const before=text.slice(0,start);
  const lines=before.split('\n').length;
  const cs=getComputedStyle(ta);
  const lineHeight=parseFloat(cs.lineHeight)||24;
  const cursorY=lines*lineHeight;
  const target=cursorY-ta.clientHeight/2+lineHeight/2;
  ta.scrollTop=Math.max(0,target);
}

let hoverTimer=null;
let hoverTarget=null;
function showHoverCard(card,anchor){
  const el=$('#hoverCard');
  const avatar=card.avatar
    ? `<div class="hc-avatar"><img src="${esc(card.avatar)}" alt=""></div>`
    : `<div class="hc-avatar">${esc((card.name||'?').trim()[0]||'?')}</div>`;
  const fields=(card.fields||[]).filter(f=>f.key&&f.value).slice(0,4);
  el.innerHTML=`
    <div class="hc-head">
      ${avatar}
      <div>
        <div class="hc-name">${esc(card.name||'未命名')}</div>
        ${(card.aliases&&card.aliases.length)?`<div class="hc-alias">别名：${esc(card.aliases.join('、'))}</div>`:''}
      </div>
    </div>
    ${fields.length?`<div class="hc-fields">
      ${fields.map(f=>`<div class="hc-field"><b>${esc(f.key)}：</b>${esc(String(f.value).slice(0,60))}</div>`).join('')}
    </div>`:''}
    ${(card.tags&&card.tags.length)?`<div class="hc-tags">${card.tags.slice(0,5).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>`:''}
    <div class="hc-hint">点击打开角色卡</div>
  `;
  el.classList.add('show');
  hoverTarget=anchor;
  positionHoverCard(anchor);
}
function positionHoverCard(anchor){
  const el=$('#hoverCard');
  const rect=anchor.getBoundingClientRect();
  const cardRect=el.getBoundingClientRect();
  let left=rect.left,top=rect.bottom+6;
  if(left+cardRect.width>window.innerWidth-8)left=window.innerWidth-cardRect.width-8;
  if(left<8)left=8;
  if(top+cardRect.height>window.innerHeight-8)top=rect.top-cardRect.height-6;
  if(top<8)top=8;
  el.style.left=left+'px';
  el.style.top=top+'px';
}
function hideHoverCard(){
  $('#hoverCard').classList.remove('show');
  hoverTarget=null;
}
document.addEventListener('mouseover',e=>{
  const wl=e.target.closest('.wikilink');
  if(!wl)return;
  if(hoverTarget===wl)return;
  const name=wl.dataset.name;
  const card=state.characters.find(x=>x.name===name);
  if(!card)return;
  clearTimeout(hoverTimer);
  hoverTimer=setTimeout(()=>showHoverCard(card,wl),350);
});
document.addEventListener('mouseout',e=>{
  const wl=e.target.closest('.wikilink');
  if(!wl)return;
  clearTimeout(hoverTimer);
  hideHoverCard();
});
window.addEventListener('scroll',()=>{if(hoverTarget)positionHoverCard(hoverTarget);},true);

function openModal(html,onMount,opts={}){
  const overlay=$('#modalOverlay');
  const modal=$('#modal');
  modal.className='modal'+(opts.wide?' wide':'');
  modal.innerHTML=html;
  overlay.classList.add('active');
  if(onMount)onMount(modal);
}
function closeModal(){
  $('#modalOverlay').classList.remove('active');
  $('#modal').innerHTML='';
}
function openPrompt(title,defaultValue,onOk,opts={}){
  openModal(`
    <div class="modal-header"><h3>${esc(title)}</h3></div>
    <div class="modal-body">
      <input class="modal-input" id="promptInput" value="${esc(defaultValue)}" type="${opts.type||'text'}">
    </div>
    <div class="modal-actions">
      <button class="btn" data-close>取消</button>
      <button class="btn primary" id="promptOk">确定</button>
    </div>
  `,root=>{
    const input=root.querySelector('#promptInput');
    setTimeout(()=>{input.focus();input.select();},30);
    const ok=()=>{
      const v=opts.type==='number'?parseInt(input.value,10):input.value.trim();
      if(opts.type==='number'){
        if(isNaN(v)||v<=0){alert('请输入正整数');return;}
      }else if(!v)return;
      onOk(v);closeModal();
    };
    root.querySelector('#promptOk').onclick=ok;
    input.onkeydown=e=>{if(e.key==='Enter')ok();};
  });
}
function openConfirm(title,message,onOk,danger=true){
  openModal(`
    <div class="modal-header"><h3>${esc(title)}</h3></div>
    <div class="modal-body"><p class="modal-text">${esc(message)}</p></div>
    <div class="modal-actions">
      <button class="btn" data-close>取消</button>
      <button class="btn ${danger?'danger':'primary'}" id="confirmOk">确定</button>
    </div>
  `,root=>{root.querySelector('#confirmOk').onclick=()=>{onOk();closeModal();};});
}

function saveSnapshot(){
  const work=getWork();
  if(!work)return;
  const snapshot={
    id:uid(),
    name:new Date().toLocaleString('zh-CN',{hour12:false}),
    time:Date.now(),
    chapters:JSON.parse(JSON.stringify(work.chapters)),
    wordCount:work.chapters.reduce((s,c)=>s+countWords(c.content),0),
  };
  if(!work.snapshots)work.snapshots=[];
  work.snapshots.unshift(snapshot);
  if(work.snapshots.length>10)work.snapshots=work.snapshots.slice(0,10);
  saveNow();
  toast('已保存快照 · '+snapshot.name);
}

  openModal(`
    <div class="modal-header">
      <h3>版本快照 · ${esc(work.title)}</h3>
      <button class="icon-btn" data-close style="opacity:1">✕</button>
    </div>
    <div class="modal-body">
      <p class="modal-text" style="font-size:12.5px;color:var(--text-3)">快照保存在本地，每部作品最多 10 个。恢复会覆盖当前章节，但不影响角色卡和设定。</p>
      <div style="margin:10px 0">
        <button class="btn primary" id="newSnapshot" style="width:100%">＋ 保存当前版本为快照</button>
      </div>
      ${list.length===0?'<div class="empty-hint">还没有快照</div>':
        list.map(s=>`
          <div class="snap-item">
            <div style="min-width:0;flex:1">
              <div class="snap-name">${esc(s.name)}</div>
              <div class="snap-meta">${s.chapters.length} 章 · ${s.wordCount} 字 · ${fmtTime(s.time)}</div>
            </div>
            <div class="snap-actions">
              <button class="btn small" data-restore="${s.id}">恢复</button>
              <button class="icon-btn" data-del-snap="${s.id}" style="opacity:1" title="删除">✕</button>
            </div>
          </div>
        `).join('')}
    </div>
    <div class="modal-actions">
      <button class="btn" data-close>关闭</button>
    </div>
  `,root=>{
    root.querySelector('#newSnapshot').onclick=()=>{
      saveSnapshot();
      closeModal();
      setTimeout(openSnapshots,100);
    };
    root.querySelectorAll('[data-restore]').forEach(b=>{
      b.onclick=()=>{
        const sid=b.dataset.restore;
        const snap=work.snapshots.find(x=>x.id===sid);
        if(!snap)return;
        openConfirm('恢复快照',`将「${work.title}」的章节恢复到「${snap.name}」的状态，当前内容会被覆盖。确定吗？`,()=>{
          work.chapters=JSON.parse(JSON.stringify(snap.chapters));
          if(!work.chapters.find(c=>c.id===state.currentChapterId)){
            state.currentChapterId=work.chapters[0]?.id||null;
          }
          saveNow();
          loadChapterIntoEditor();
          render();
          toast('已恢复快照');
        });
      };
    });
    root.querySelectorAll('[data-del-snap]').forEach(b=>{
      b.onclick=()=>{
        const sid=b.dataset.delSnap;
        openConfirm('删除快照','确定删除这个快照吗？',()=>{
          work.snapshots=work.snapshots.filter(x=>x.id!==sid);
          saveNow();
          closeModal();
          setTimeout(openSnapshots,100);
        });
      };
    });
  },{wide:true});
}

function makeChar(overrides={}){
  return Object.assign({
    id:uid(),name:'',aliases:[],tags:[],avatar:'',
    fields:[{key:'身份',value:''},{key:'外貌',value:''},{key:'性格',value:''},{key:'背景',value:''},{key:'能力',value:''},{key:'备注',value:''}],
    relations:[],
  },overrides);
}
function syncCharacterRelations(char,originalRelations){
  const currentName=char.name;
  const newRelations=(char.relations||[]).filter(r=>r.target&&r.target.trim());

  // 第一步：关系里出现的陌生名字，自动建卡
  const autoCreated=[];
  newRelations.forEach(r=>{
    const raw=r.target.trim();
    if(!raw)return;
    const resolved=resolveCharName(raw);
    const existing=state.characters.find(x=>x.name===resolved);
    if(!existing){
      const newCard=makeChar({name:raw});
      state.characters.push(newCard);
      autoCreated.push(raw);
    }
  });

   // 第二步：双向同步关系
  newRelations.forEach(r=>{
    const targetName=resolveCharName(r.target.trim());
    const target=state.characters.find(x=>x.name===targetName);
    if(!target||target.id===char.id)return;
    if(!target.relations)target.relations=[];
    const exists=target.relations.some(tr=>tr.target===currentName);
    if(!exists){
      target.relations.push({target:currentName,type:r.type||'',note:'',_autoMirror:true});
    }
  });

  // 第三步：被删除的关系，对方有自动镜像的也删掉
  (originalRelations||[]).forEach(or=>{
    if(!or.target||!or.target.trim())return;
    const targetName=resolveCharName(or.target.trim());
    const stillThere=newRelations.some(r=>resolveCharName(r.target.trim())===targetName);
    if(stillThere)return;
    const target=state.characters.find(x=>x.name===targetName);
    if(!target||!target.relations)return;
    target.relations=target.relations.filter(tr=>{
      if(tr.target!==currentName)return true;
      if(tr._autoMirror)return false;
      return true;
    });
  });

  return autoCreated;
}

function openCharacterEditor(char){
  // 只要这个 id 还没进 state.characters，就当成新建
  const isNew = !char || !state.characters.find(x=>x.id===char.id);
  const c=char?JSON.parse(JSON.stringify(char)):makeChar();
  const originalName=c.name;
  const originalRelations=char?JSON.parse(JSON.stringify(char.relations||[])):[];
  const datalistHTML=state.characters.filter(x=>x.id!==c.id&&x.name).map(x=>`<option value="${esc(x.name)}"></option>`).join('');
  const appearances=isNew?[]:findCharacterAppearances(c);
  const appearancesHTML=isNew?'':`
    <div class="char-fields-head"><span>出场章节 · ${appearances.length}</span></div>
    ${appearances.length===0
      ?'<div class="empty-hint">正文里还没有引用到这个角色</div>'
      :appearances.map(a=>`
        <div class="appear-item" data-jump-appear="${a.workId}__${a.chapterId}">
          <span><span class="ch">${esc(a.chapterTitle)}</span><span class="wk">${esc(a.workTitle)}</span></span>
          <span style="font-size:11px;color:var(--text-3)">跳转 →</span>
        </div>
      `).join('')}
  `;
  openModal(`
    <div class="modal-header">
      <h3>${isNew?'新建角色卡':'编辑角色卡'}</h3>
      <button class="icon-btn" data-close style="opacity:1">✕</button>
    </div>
    <div class="modal-body">
      <datalist id="charNameList">${datalistHTML}</datalist>

      <input class="modal-input" id="fName" value="${esc(c.name)}" placeholder="角色的主名">
      <label class="form-label">别名（用逗号分隔，正文写 [[别名]] 也能匹配）</label>
      <input class="modal-input" id="fAliases" value="${esc((c.aliases||[]).join('、'))}" placeholder="昵称、化名、称呼">
      <label class="form-label">标签（用逗号分隔）</label>
      <input class="modal-input" id="fTags" value="${esc((c.tags||[]).join('、'))}" placeholder="CP、阵营、AU、原作">
      <label class="form-label">头像图片 URL（可留空）</label>
      <input class="modal-input" id="fAvatar" value="${esc(c.avatar||'')}" placeholder="https://...">
      <div class="char-fields-head">
        <span>自定义字段</span>
        <button class="btn small" id="addField">＋ 添加字段</button>
      </div>
      <div id="fieldList"></div>
      <div class="char-fields-head">
        <span>角色关系 <span style="color:var(--text-3);font-weight:400">（对方也会自动出现）</span></span>
        <button class="btn small" id="addRelation">＋ 添加关系</button>
      </div>
      <div id="relationList"></div>
      ${appearancesHTML}
    </div>
    <div class="modal-actions">
      ${isNew?'':`<button class="btn" id="saveAsTpl">存为模板</button>`}
      ${isNew?'':'<button class="btn danger" id="delChar">删除</button>'}
      <button class="btn" data-close>取消</button>
      <button class="btn primary" id="saveChar">保存</button>
    </div>
  `,root=>{
    const fieldList=root.querySelector('#fieldList');
    const relList=root.querySelector('#relationList');
    function renderFields(){
      fieldList.innerHTML=c.fields.map((f,i)=>`
        <div class="field-row">
          <input class="modal-input key" data-idx="${i}" data-k="key" value="${esc(f.key)}" placeholder="字段名">
          <input class="modal-input val" data-idx="${i}" data-k="value" value="${esc(f.value)}" placeholder="内容">
          <button class="icon-btn" data-del="${i}" title="删除">✕</button>
        </div>
      `).join('');
    }
    function renderRelations(){
      relList.innerHTML=c.relations.map((r,i)=>`
        <div class="rel-item">
          <div class="rel-row">
            <input class="modal-input rel-target" list="charNameList" data-ridx="${i}" data-rk="target" value="${esc(r.target)}" placeholder="角色名">
            <input class="modal-input rel-type" data-ridx="${i}" data-rk="type" value="${esc(r.type)}" placeholder="关系">
            <button class="icon-btn" data-del-rel="${i}" title="删除">✕</button>
          </div>
          <div style="display:flex;gap:6px;align-items:center">
            <input class="modal-input rel-note" style="flex:1" data-ridx="${i}" data-rk="note" value="${esc(r.note)}" placeholder="备注（选填）">
            ${r._autoMirror?'<span class="rel-auto" title="由对方的关系自动同步生成">自动</span>':''}
          </div>
        </div>
      `).join('');
    }
    renderFields();renderRelations();
    fieldList.addEventListener('input',e=>{
      const t=e.target;
      if(t.dataset.idx!==undefined)c.fields[+t.dataset.idx][t.dataset.k]=t.value;
    });
    fieldList.addEventListener('click',e=>{
      const del=e.target.closest('[data-del]');
      if(del){c.fields.splice(+del.dataset.del,1);renderFields();}
    });
    relList.addEventListener('input',e=>{
      const t=e.target;
      if(t.dataset.ridx!==undefined){
        c.relations[+t.dataset.ridx][t.dataset.rk]=t.value;
        if(t.dataset.rk==='type'||t.dataset.rk==='note'){
          delete c.relations[+t.dataset.ridx]._autoMirror;
        }
      }
    });
    relList.addEventListener('click',e=>{
      const del=e.target.closest('[data-del-rel]');
      if(del){c.relations.splice(+del.dataset.delRel,1);renderRelations();}
    });
    root.querySelector('#addField').onclick=()=>{
      c.fields.push({key:'',value:''});renderFields();
      const inputs=fieldList.querySelectorAll('.key');inputs[inputs.length-1]?.focus();
    };
    root.querySelector('#addRelation').onclick=()=>{
      c.relations.push({target:'',type:'',note:''});renderRelations();
      const inputs=relList.querySelectorAll('.rel-target');inputs[inputs.length-1]?.focus();
    };
    root.querySelectorAll('[data-jump-appear]').forEach(el=>{
      el.addEventListener('click',()=>{
        const [wid,cid]=el.dataset.jumpAppear.split('__');
        closeModal();
        setTimeout(()=>{
          state.currentWorkId=wid;
          state.currentChapterId=cid;
          loadChapterIntoEditor();saveNow();render();
        },100);
      });
    });
    root.querySelector('#saveChar').onclick=()=>{
      const name=root.querySelector('#fName').value.trim();
      if(!name){alert('请填写姓名');return;}
      c.name=name;
      c.aliases=root.querySelector('#fAliases').value.split(/[、,，]/).map(s=>s.trim()).filter(Boolean);
      c.tags=root.querySelector('#fTags').value.split(/[、,，]/).map(s=>s.trim()).filter(Boolean);
      c.avatar=root.querySelector('#fAvatar').value.trim();
      c.fields=c.fields.filter(f=>(f.key||'').trim()||(f.value||'').trim());
      c.relations=c.relations.filter(r=>(r.target||'').trim()||(r.type||'').trim()||(r.note||'').trim());
      let renamedCount=0;
      if(!isNew&&originalName&&originalName!==c.name){
        const re=new RegExp(`\\[\\[${escapeRegExp(originalName)}\\]\\]`,'g');
        state.works.forEach(w=>w.chapters.forEach(ch=>{
          const before=ch.content;
          ch.content=ch.content.replace(re,`[[${c.name}]]`);
          if(before!==ch.content)renamedCount++;
        }));
        state.characters.forEach(other=>{
          (other.relations||[]).forEach(r=>{if(r.target===originalName)r.target=c.name;});
        });
      }
      if(isNew)state.characters.push(c);
      else{const idx=state.characters.findIndex(x=>x.id===c.id);if(idx>=0)state.characters[idx]=c;}
      syncCharacterRelations(c,originalRelations);
      saveNow();closeModal();
      if(renamedCount>0)toast(`已全局替换「${originalName}」→「${c.name}」，涉及 ${renamedCount} 个章节`);
      if(!isNew&&state.currentChapterId){
        const cur=getChapter();
        if(cur&&cur.content!==$('#editor').value){$('#editor').value=cur.content;updateEditorMeta();}
      }
      render();
    };
    const saveTplBtn=root.querySelector('#saveAsTpl');
    if(saveTplBtn){
      saveTplBtn.onclick=()=>{
        openPrompt('保存为模板','模板名',v=>{
          state.templates.push({id:uid(),name:v,desc:'自定义模板',fields:JSON.parse(JSON.stringify(c.fields))});
          saveNow();toast('已保存为模板');
        });
      };
    }
    const delBtn=root.querySelector('#delChar');
    if(delBtn){
      delBtn.onclick=()=>{
        openConfirm('删除角色卡',`确定删除「${c.name}」吗？此操作不可撤销。`,()=>{
          const namesToRemove=new Set([c.name,...(c.aliases||[])]);
          state.characters=state.characters.filter(x=>x.id!==c.id);
          state.characters.forEach(other=>{
            if(other.relations)other.relations=other.relations.filter(r=>!namesToRemove.has(r.target));
          });
          saveNow();closeModal();render();
        });
      };
    }
  });
}

/* ============================================================
   15. 关系图 / 一致性检查
============================================================ */
function openRelationGraph(){
  if(state.characters.length===0){
    openModal(`
      <div class="modal-header"><h3>关系图</h3><button class="icon-btn" data-close style="opacity:1">✕</button></div>
      <div class="modal-body"><p class="modal-text">还没有角色卡。先创建角色卡，再添加关系。</p></div>
      <div class="modal-actions"><button class="btn primary" data-close>知道了</button></div>
    `);
    return;
  }
  openModal(`
    <div class="modal-header">
      <h3>角色关系图</h3>
      <div>
        <button class="btn small" id="graphReset">重置视图</button>
        <button class="icon-btn" data-close style="opacity:1">✕</button>
      </div>
    </div>
    <div class="modal-body" style="padding-bottom:16px">
      <div class="graph-wrap" id="graphWrap"></div>
      <div style="margin-top:10px;font-size:11.5px;color:var(--text-3);line-height:1.7">
        点击节点打开角色卡。箭头方向为「A → B」表示 A 的关系里写了 B。虚线单向，实线双向。
      </div>
    </div>
  `,root=>{
    const wrap=root.querySelector('#graphWrap');
    function draw(){
      const chars=state.characters.filter(c=>c.name);
      const n=chars.length;
      const w=wrap.clientWidth||720;
      const h=Math.max(420,n*70);
      wrap.style.height=h+'px';
      const cx=w/2,cy=h/2;
      const R=Math.min(w,h)*0.36;
      const pos={};
      chars.forEach((c,i)=>{
        const a=-Math.PI/2+(2*Math.PI*i)/n;
        pos[c.id]={x:cx+R*Math.cos(a),y:cy+R*Math.sin(a),c};
      });
      const edges={};
      chars.forEach(c=>{
        (c.relations||[]).forEach(r=>{
          if(!r.target)return;
          const resolved=resolveCharName(r.target);
          const t=chars.find(x=>x.name===resolved);
          if(!t||t.id===c.id)return;
          const key=[c.id,t.id].sort().join('__');
          if(!edges[key])edges[key]={a:c.id,b:t.id,typesA:[]};
          edges[key].typesA.push(r.type||'—');
        });
      });
      Object.values(edges).forEach(e=>{
        const rev=edges[[e.b,e.a].sort().join('__')];
        e.both=!!rev;
      });
      const edgesHTML=Object.values(edges).map(e=>{
        const p1=pos[e.a],p2=pos[e.b];
        if(!p1||!p2)return '';
        const both=e.both;
        const midX=(p1.x+p2.x)/2,midY=(p1.y+p2.y)/2;
        const label=e.typesA.join('/');
        return `<line class="graph-edge ${both?'hl':''}" x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}" stroke-dasharray="${both?'0':'4 3'}"/>
          <text class="graph-edge-label" x="${midX}" y="${midY-4}" text-anchor="middle">${esc(label)}</text>`;
      }).join('');
      const nodesHTML=chars.map(c=>{
        const p=pos[c.id];
        const initial=(c.name||'?').trim()[0]||'?';
        const hasImg=c.avatar;
        return `<g class="graph-node" data-char-id="${c.id}" style="cursor:pointer">
          <circle cx="${p.x}" cy="${p.y}" r="22" fill="var(--accent)" stroke="var(--panel)" stroke-width="2"/>
          ${hasImg?`<image href="${esc(c.avatar)}" x="${p.x-22}" y="${p.y-22}" width="44" height="44" clip-path="circle(22px at 22px 22px)" preserveAspectRatio="xMidYMid slice"/>`:''}
          <text x="${p.x}" y="${p.y+5}" text-anchor="middle" fill="#fff" font-weight="600" font-size="14">${esc(hasImg?'':initial)}</text>
          <text x="${p.x}" y="${p.y+40}" text-anchor="middle">${esc(c.name)}</text>
        </g>`;
      }).join('');
      wrap.innerHTML=`<svg class="graph-svg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet">
        <defs><marker id="arrow" viewBox="0 0 10 10" refX="24" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--text-3)"/></marker></defs>
        ${edgesHTML}${nodesHTML}
      </svg>`;
    }
    draw();
    root.querySelector('#graphReset').onclick=draw;
    wrap.addEventListener('click',e=>{
      const node=e.target.closest('.graph-node');
      if(node){
        const c=state.characters.find(x=>x.id===node.dataset.charId);
        if(c){closeModal();setTimeout(()=>openCharacterEditor(c),100);}
      }
    });
  },{wide:true});
}
function openConsistencyCheck(){
  const refs={};
  state.works.forEach(w=>w.chapters.forEach(ch=>{
    const re=/\[\[(.+?)\]\]/g;let m;
    const seen=new Set();
    while((m=re.exec(ch.content))){
      const n=m[1].trim();
      if(!n||seen.has(n))continue;
      seen.add(n);
      if(!refs[n])refs[n]={count:0};
      refs[n].count++;
    }
  }));
  const missing=[];
  Object.keys(refs).forEach(rawName=>{
    if(!findCharCard(rawName))missing.push({raw:rawName,count:refs[rawName].count});
  });
  const allNames=new Set();
  state.characters.forEach(c=>{
    allNames.add(c.name);
    (c.aliases||[]).forEach(a=>allNames.add(a));
  });
  const unused=state.characters.filter(c=>{
    if(!c.name)return false;
    const names=[c.name,...(c.aliases||[])];
    return !names.some(n=>refs[n]);
  }).map(c=>c.name);
  const badRelations=[];
  state.characters.forEach(c=>{
    (c.relations||[]).forEach(r=>{
      if(r.target&&!allNames.has(r.target)){
        badRelations.push({from:c.name,target:r.target,type:r.type||''});
      }
    });
  });
  const hasIssue=missing.length||badRelations.length;
  openModal(`
    <div class="modal-header"><h3>一致性检查</h3><button class="icon-btn" data-close style="opacity:1">✕</button></div>
    <div class="modal-body">
      ${!hasIssue?'<p class="modal-text" style="color:var(--accent)">✓ 没有发现问题</p>':''}
      <div class="char-fields-head"><span>未建卡的角色引用 · ${missing.length}</span></div>
      ${missing.length===0?'<div class="empty-hint">全部有角色卡</div>':
        `<div class="check-list">${missing.map(m=>`
          <div class="check-item">
            <div><span class="name">${esc(m.raw)}</span><span class="meta">出现 ${m.count} 章</span></div>
            <div class="actions"><button class="btn small" data-create-char="${esc(m.raw)}">建卡</button></div>
          </div>
        `).join('')}</div>`
      }
      <div class="char-fields-head"><span>关系里指向未知角色 · ${badRelations.length}</span></div>
      ${badRelations.length===0?'<div class="empty-hint">全部有效</div>':
        `<div class="check-list">${badRelations.map(b=>`
          <div class="check-item">
            <div><span class="name">${esc(b.from)} → ${esc(b.target)}</span><span class="meta">${esc(b.type||'')}</span></div>
          </div>
        `).join('')}</div>`
      }
      <div class="char-fields-head"><span>从未在正文引用的角色 · ${unused.length}</span></div>
      ${unused.length===0?'<div class="empty-hint">全部有出场</div>':
        `<div class="empty-hint" style="text-align:left;padding:6px 8px">${unused.map(esc).join('、')}</div>`
      }
    </div>
    <div class="modal-actions"><button class="btn primary" data-close>关闭</button></div>
  `,root=>{
    root.querySelectorAll('[data-create-char]').forEach(b=>{
      b.onclick=()=>{
        const name=b.dataset.createChar;
        closeModal();
        setTimeout(()=>{
          openTemplatePicker(t=>{
            openCharacterEditor(makeChar({name,fields:t.fields.map(f=>({...f}))}));
          });
        },100);
      };
    });
  },{wide:true});
}
