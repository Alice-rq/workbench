   16. 全局搜索
============================================================ */
function openSearchModal(){
  openModal(`
    <div class="search-input-wrap">
      <input class="search-input" id="searchInput" placeholder="搜索章节、角色、设定、事件、线索、素材……" autocomplete="off">
      <button class="icon-btn" data-close style="opacity:1;font-size:16px">✕</button>
    </div>
    <div class="search-results" id="searchResults"><div class="empty-hint">输入关键词开始搜索</div></div>
    <div class="modal-actions" style="justify-content:space-between">
      <span style="font-size:11.5px;color:var(--text-3)">Esc 关闭 · Enter 打开第一条</span>
      <button class="btn" data-close>关闭</button>
    </div>
  `,root=>{
    const input=root.querySelector('#searchInput');
    const results=root.querySelector('#searchResults');
    let currentResults=[];
    function doSearch(q){
      currentResults=[];
      if(!q.trim()){results.innerHTML='<div class="empty-hint">输入关键词开始搜索</div>';return;}
      const lower=q.toLowerCase();
      const match=s=>String(s||'').toLowerCase().includes(lower);
      const groups=[];
      const chapterHits=[];
      state.works.forEach(w=>w.chapters.forEach(ch=>{
        if(match(ch.title)||match(ch.content)){
          let snippet='';
          if(match(ch.content)){
            const idx=ch.content.toLowerCase().indexOf(lower);
            const start=Math.max(0,idx-30);
            const end=Math.min(ch.content.length,idx+q.length+50);
            snippet=(start>0?'…':'')+ch.content.slice(start,end)+(end<ch.content.length?'…':'');
          }else snippet=ch.content.slice(0,80)+'…';
          chapterHits.push({type:'chapter',workId:w.id,chapterId:ch.id,title:ch.title||'未命名',subtitle:w.title,snippet});
        }
      }));
      if(chapterHits.length)groups.push({title:`章节 · ${chapterHits.length}`,items:chapterHits});
      const charHits=state.characters.filter(c=>match(c.name)||(c.aliases||[]).some(match)||(c.tags||[]).some(match)||(c.fields||[]).some(f=>match(f.key)||match(f.value))).map(c=>({
        type:'character',id:c.id,title:c.name||'未命名',subtitle:(c.tags||[]).join(' · '),
        snippet:(c.fields||[]).map(f=>`${f.key}：${f.value}`).filter(s=>s!=='：').slice(0,2).join(' | '),
      }));
      if(charHits.length)groups.push({title:`角色 · ${charHits.length}`,items:charHits});
      const settingHits=state.settings.filter(s=>match(s.name)||match(s.category)||match(s.content)||(s.tags||[]).some(match)).map(s=>({
        type:'setting',id:s.id,title:s.name||'未命名',subtitle:s.category||'',snippet:(s.content||'').slice(0,100),
      }));
      if(settingHits.length)groups.push({title:`设定 · ${settingHits.length}`,items:settingHits});
      const eventHits=state.events.filter(ev=>match(ev.title)||match(ev.time)||match(ev.description)||(ev.tags||[]).some(match)).map(ev=>({
        type:'event',id:ev.id,title:ev.title||'未命名',subtitle:ev.time||'',snippet:(ev.description||'').slice(0,100),
      }));
      if(eventHits.length)groups.push({title:`事件 · ${eventHits.length}`,items:eventHits});
      const clueHits=state.clues.filter(cl=>match(cl.title)||match(cl.description)||(cl.tags||[]).some(match)).map(cl=>({
        type:'clue',id:cl.id,title:cl.title||'未命名',subtitle:CLUE_STATUSES[cl.status]?.label||'',snippet:(cl.description||'').slice(0,100),
      }));
      if(clueHits.length)groups.push({title:`线索 · ${clueHits.length}`,items:clueHits});
      const matHits=state.materials.filter(m=>match(m.title)||match(m.content)||match(m.category)||(m.tags||[]).some(match)).map(m=>({
        type:'material',id:m.id,title:m.title||'未命名',subtitle:m.category||'',snippet:(m.content||'').slice(0,100),
      }));
      if(matHits.length)groups.push({title:`素材 · ${matHits.length}`,items:matHits});
      if(groups.length===0){results.innerHTML='<div class="empty-hint">没有找到结果</div>';return;}
      results.innerHTML=groups.map(g=>`
        <div class="search-group-title">${g.title}</div>
        ${g.items.map(item=>{
          currentResults.push(item);
          const i=currentResults.length-1;
          return `<div class="search-result" data-result-idx="${i}">
            <div class="title">${highlight(item.title,q)} <span style="color:var(--text-3);font-weight:400;font-size:11.5px">${esc(item.subtitle||'')}</span></div>
            <div class="snippet">${highlight(item.snippet,q)}</div>
          </div>`;
        }).join('')}
      `).join('');
    }
    function openResult(item){
      closeModal();
      if(item.type==='chapter'){
        state.currentWorkId=item.workId;state.currentChapterId=item.chapterId;
        loadChapterIntoEditor();saveNow();render();
      }else if(item.type==='character'){
        const c=state.characters.find(x=>x.id===item.id);if(c)setTimeout(()=>openCharacterEditor(c),100);
      }else if(item.type==='setting'){
        const s=state.settings.find(x=>x.id===item.id);if(s)setTimeout(()=>openSettingEditor(s),100);
      }else if(item.type==='event'){
        const e=state.events.find(x=>x.id===item.id);if(e)setTimeout(()=>openEventEditor(e),100);
      }else if(item.type==='clue'){
        const c=state.clues.find(x=>x.id===item.id);if(c)setTimeout(()=>openClueEditor(c),100);
      }else if(item.type==='material'){
        const m=state.materials.find(x=>x.id===item.id);if(m)setTimeout(()=>openMaterialEditor(m),100);
      }
    }
    input.addEventListener('input',()=>doSearch(input.value));
    results.addEventListener('click',e=>{
      const r=e.target.closest('.search-result');
      if(r){const item=currentResults[+r.dataset.resultIdx];if(item)openResult(item);}
    });
    input.addEventListener('keydown',e=>{
      if(e.key==='Enter'&&currentResults.length>0)openResult(currentResults[0]);
    });
    setTimeout(()=>input.focus(),50);
  },{wide:true});
}

/* ============================================================
   17. 查找替换
============================================================ */
function openReplaceModal(){
  openModal(`
    <div class="modal-header"><h3>查找替换</h3><button class="icon-btn" data-close style="opacity:1">✕</button></div>
    <div class="replace-row"><input class="modal-input" id="findInput" placeholder="查找内容"></div>
    <div class="replace-row"><input class="modal-input" id="replInput" placeholder="替换为（留空则删除）"></div>
    <div class="replace-scope">
      <span style="font-size:12px;color:var(--text-3)">范围：</span>
      <label><input type="radio" name="replaceScope" value="chapter" checked> 当前章节</label>
      <label><input type="radio" name="replaceScope" value="work"> 当前作品</label>
      <label><input type="radio" name="replaceScope" value="all"> 全部作品</label>
    </div>
    <div class="replace-count" id="replaceCount">输入查找内容，实时预览匹配结果</div>
    <div class="replace-results" id="replaceResults"></div>
    <div class="replace-actions">
      <button class="btn" data-close>取消</button>
      <button class="btn primary" id="btnDoReplace" disabled>全部替换</button>
    </div>
  `,root=>{
    const findInput=root.querySelector('#findInput');
    const replInput=root.querySelector('#replInput');
    const countEl=root.querySelector('#replaceCount');
    const resultsEl=root.querySelector('#replaceResults');
    const btnDoReplace=root.querySelector('#btnDoReplace');
    function getScope(){return root.querySelector('input[name="replaceScope"]:checked').value;}
    function getTargets(){
      const scope=getScope();
      const targets=[];
      if(scope==='chapter'){
        const ch=getChapter();
        if(ch)targets.push({work:getWork(),chapter:ch});
      }else if(scope==='work'){
        const w=getWork();
        if(w)w.chapters.forEach(ch=>targets.push({work:w,chapter:ch}));
      }else{
        state.works.forEach(w=>w.chapters.forEach(ch=>targets.push({work:w,chapter:ch})));
      }
      return targets;
    }
    function countMatches(){
      const q=findInput.value;
      if(!q){countEl.textContent='输入查找内容，实时预览匹配结果';resultsEl.innerHTML='';btnDoReplace.disabled=true;return;}
      const re=new RegExp(escapeRegExp(q),'g');
      const targets=getTargets();
      const groups=[];let total=0;
      targets.forEach(t=>{
        const content=t.chapter.content||'';
        const matches=content.match(re);
        if(matches&&matches.length){total+=matches.length;groups.push({t,count:matches.length,content});}
      });
      countEl.innerHTML=`共找到 <b>${total}</b> 处，涉及 ${groups.length} 个章节`;
      btnDoReplace.disabled=total===0;
      resultsEl.innerHTML=groups.slice(0,8).map(g=>{
        const idxs=[];const reG=new RegExp(escapeRegExp(q),'g');let mm;let limit=2;
        while((mm=reG.exec(g.content))&&limit>0){idxs.push(mm.index);limit--;}
        const snippets=idxs.map(idx=>{
          const start=Math.max(0,idx-25);
          const end=Math.min(g.content.length,idx+q.length+25);
          const pre=g.content.slice(start,idx);
          const match=g.content.slice(idx,idx+q.length);
          const post=g.content.slice(idx+q.length,end);
          return `${start>0?'…':''}${esc(pre)}<mark>${esc(match)}</mark>${esc(post)}${end<g.content.length?'…':''}`;
        }).join('<br>');
        return `<div class="replace-group">
          <div class="replace-group-title">${esc(g.t.work.title)} · ${esc(g.t.chapter.title)}（${g.count} 处）</div>
          <div class="replace-hit">${snippets}</div>
        </div>`;
      }).join('');
      if(groups.length>8)resultsEl.innerHTML+=`<div class="empty-hint">还有 ${groups.length-8} 个章节未显示…</div>`;
    }
    findInput.addEventListener('input',countMatches);
    root.querySelectorAll('input[name="replaceScope"]').forEach(r=>r.addEventListener('change',countMatches));
    btnDoReplace.onclick=()=>{
      const q=findInput.value;const r=replInput.value;
      if(!q)return;
      const targets=getTargets();
      const re=new RegExp(escapeRegExp(q),'g');
      let count=0;
      targets.forEach(t=>{
        const before=t.chapter.content||'';
        const after=before.replace(re,r);
        if(before!==after){t.chapter.content=after;count++;}
      });
      saveNow();loadChapterIntoEditor();renderRight();
      toast(`已替换 ${count} 个章节`);
      closeModal();
    };
    setTimeout(()=>findInput.focus(),50);
  },{wide:true});
}

document.addEventListener('click',e=>{
  if(e.target.closest('[data-close]')){closeModal();return;}
  if(e.target.id==='modalOverlay'){closeModal();return;}

  const ideaStatus = e.target.closest('[data-idea-status]');
  if (ideaStatus) {
    ideaFilter.status = ideaStatus.dataset.ideaStatus;
    renderTab();
    return;
  }
  const ideaCat = e.target.closest('[data-idea-cat]');
  if (ideaCat) {
    ideaFilter.category = ideaCat.dataset.ideaCat;
    renderTab();
    return;
  }
  const chip=e.target.closest('.filter-chip');
  if(chip){
    const scope=chip.dataset.filterScope;
    const tag=chip.dataset.filterTag;
    if(!tag)filterTags[scope]=[];
    else{
      const arr=filterTags[scope];
      const i=arr.indexOf(tag);
      if(i>=0)arr.splice(i,1);else arr.push(tag);
    }
    renderTab();return;
  }

  const wikilink=e.target.closest('.wikilink');
  if(wikilink){
    const name=wikilink.dataset.name;
    const c=state.characters.find(x=>x.name===name);
    if(c)openCharacterEditor(c);
    else openConfirm('创建角色卡',`角色「${name}」还没有角色卡，现在创建吗？`,()=>{
      openTemplatePicker(t=>{openCharacterEditor(makeChar({name,fields:t.fields.map(f=>({...f}))}));});
    },false);
    return;
  }

  const btn=e.target.closest('[data-action]');
  if(!btn)return;
  const action=btn.dataset.action;

  switch(action){
    case 'select-work':{
      const block=btn.closest('[data-work]');
      const wid=block.dataset.work;
      if(wid===state.currentWorkId)return;
      state.currentWorkId=wid;
      const w=getWork();
      state.currentChapterId=w.chapters[0]?.id||null;
      loadChapterIntoEditor();saveNow();render();

    }
    case 'add-chapter':{
      e.stopPropagation();
      const block=btn.closest('[data-work]');
      const work=state.works.find(w=>w.id===block.dataset.work);
      openChapterTemplatePicker(t=>{
        const ch={id:uid(),title:`第${work.chapters.length+1}章`,content:t.content,summary:'',updatedAt:Date.now()};
        work.chapters.push(ch);
        state.currentWorkId=work.id;
        state.currentChapterId=ch.id;
        loadChapterIntoEditor();saveNow();render();
        $('#chapterTitle').focus();$('#chapterTitle').select();
      });
      break;
    }
    case 'select-chapter':{
      const id=btn.closest('[data-chapter]').dataset.chapter;
      if(id===state.currentChapterId)return;
      state.currentChapterId=id;
      loadChapterIntoEditor();saveNow();render();
      break;
    }
    case 'chapter-menu':{
      e.stopPropagation();
      const id=btn.closest('[data-chapter]').dataset.chapter;
      const work=getWork();
      const ch=work.chapters.find(c=>c.id===id);
      if(!ch)return;
      openModal(`
        <div class="modal-header"><h3>${esc(ch.title)}</h3><button class="icon-btn" data-close style="opacity:1">✕</button></div>
        <div class="modal-body" style="padding-bottom:16px">
          <div class="modal-actions" style="border:none;padding:0;flex-direction:column;align-items:stretch">
            <button class="btn" id="mRename">重命名</button>
            <button class="btn" id="mDuplicate">复制章节</button>
            <button class="btn danger" id="mDelete">删除章节</button>
          </div>
        </div>
      `,root=>{
        root.querySelector('#mRename').onclick=()=>{
          closeModal();
          setTimeout(()=>openPrompt('重命名章节',ch.title,v=>{
            ch.title=v;saveNow();

          const copy={id:uid(),title:ch.title+' 副本',content:ch.content,summary:ch.summary||'',updatedAt:Date.now()};

              state.currentChapterId=work.chapters[0]?.id||null;
              loadChapterIntoEditor();
            }
            saveNow();render();
          }),100);
        };
      });

    }
    case 'work-menu':{
      e.stopPropagation();
      const block=btn.closest('[data-work]');
      const work=state.works.find(w=>w.id===block.dataset.work);
      openModal(`
        <div class="modal-header"><h3>${esc(work.title)}</h3><button class="icon-btn" data-close style="opacity:1">✕</button></div>
        <div class="modal-body" style="padding-bottom:16px">
          <div class="modal-actions" style="border:none;padding:0;flex-direction:column;align-items:stretch">
            <button class="btn" id="mRename">重命名作品</button>
            <button class="btn" id="mToggleType">切换类型（当前：${work.type==='fanfic'?'同人':'原创'}）</button>
            <button class="btn" id="mSnapshots">📸 版本快照 · ${(work.snapshots||[]).length}</button>
            <button class="btn danger" id="mDelete">删除作品</button>
          </div>
        </div>
      `,root=>{
        root.querySelector('#mRename').onclick=()=>{
          closeModal();
          setTimeout(()=>openPrompt('重命名作品',work.title,v=>{work.title=v;saveNow();render();}),100);
        };
        root.querySelector('#mToggleType').onclick=()=>{
          work.type=work.type==='fanfic'?'original':'fanfic';
          saveNow();closeModal();render();
        };
        root.querySelector('#mSnapshots').onclick=()=>{
          closeModal();
          setTimeout(openSnapshots,100);
        };
        root.querySelector('#mDelete').onclick=()=>{
          closeModal();
          setTimeout(()=>openConfirm('删除作品',`确定删除「${work.title}」及其全部章节吗？`,()=>{
            state.works=state.works.filter(w=>w.id!==work.id);
            if(!state.works.length)initSample();
            if(state.currentWorkId===work.id){
              state.currentWorkId=state.works[0].id;
              state.currentChapterId=state.works[0].chapters[0]?.id||null;
            }
            saveNow();loadChapterIntoEditor();render();
          }),100);
        };
      });
      break;
    }
    case 'new-work':{
      openPrompt('新建作品','新作品',v=>{
        const wid=uid();
        state.works.push({
          id:wid,title:v,type:'fanfic',
          chapters:[{id:uid(),title:'第一章',content:'',summary:'',updatedAt:Date.now()}],
          snapshots:[],createdAt:Date.now(),
        });
        state.currentWorkId=wid;
        state.currentChapterId=state.works[state.works.length-1].chapters[0].id;
        loadChapterIntoEditor();saveNow();render();
      });
      break;
    }
    case 'new-character':{
      openTemplatePicker(t=>{openCharacterEditor(makeChar({fields:t.fields.map(f=>({...f}))}));});
      break;
    }
    case 'edit-character':{
      const id=btn.dataset.id;
      const c=state.characters.find(x=>x.id===id);
      if(c)openCharacterEditor(c);
      break;
    }
    case 'new-setting':openSettingEditor(null);break;
    case 'edit-setting':{
      const id=btn.dataset.id;
      const s=state.settings.find(x=>x.id===id);
      if(s)openSettingEditor(s);
      break;
    }
    case 'new-event':openEventEditor(null);break;
    case 'edit-event':{
      const id=btn.dataset.id;
      const e=state.events.find(x=>x.id===id);
      if(e)openEventEditor(e);
      break;
    }
    case 'new-clue':openClueEditor(null);break;
    case 'edit-clue':{
      const id=btn.dataset.id;
      const cl=state.clues.find(x=>x.id===id);
      if(cl)openClueEditor(cl);
      break;
    }
    case 'new-material':openMaterialEditor(null);break;
    case 'edit-material':{
      const id=btn.dataset.id;
      const m=state.materials.find(x=>x.id===id);
      if(m)openMaterialEditor(m);
      break;
    }
    case 'timeline-sort':{
      state.events.sort((a,b)=>String(a.time||'').localeCompare(String(b.time||''),'zh'));
      saveNow();renderTab();toast('已按时间排序');
      break;
    }
    case 'jump-char':{
      const name=btn.dataset.name;
      const c=state.characters.find(x=>x.name===name);
      if(c)openCharacterEditor(c);
      else openConfirm('创建角色卡',`角色「${name}」还没有角色卡，现在创建吗？`,()=>{
        openTemplatePicker(t=>{openCharacterEditor(makeChar({name,fields:t.fields.map(f=>({...f}))}));});
      },false);
      break;
    }
    case 'clear-today':{
      openConfirm('清零今日字数','只清空今天的字数记录，历史记录和其他内容都保留。确定吗？',()=>{
        state.dailyStats[todayKey()] = 0;
        _lastTotalWords = getAllWords();
        saveNow();
        updateEditorMeta();
        renderRight();
        toast('今日字数已清零');
      });
      break;
    }
    case 'edit-chapter-goal':{
      const ch=getChapter();
      if(!ch){toast('请先选择章节');break;}
      openPrompt('本章字数目标（0 = 取消）', String(ch.wordGoal||2000), v=>{
        const n=parseInt(v,10)||0;
        ch.wordGoal=n>0?n:0;
        saveNow();renderRight();
        toast(n>0?`本章目标 ${n} 字`:'已取消本章目标');
      },{type:'number'});
      break;
    }
    case 'edit-goal':{
      openPrompt('每日字数目标',String(prefs.dailyGoal||1000),v=>{
        prefs.dailyGoal=v;saveNow();renderRight();
        toast(`目标已改为 ${v} 字`);
      },{type:'number'});
      break;
    }
    case 'toggle-outline':{
      prefs.outlineCollapsed=!prefs.outlineCollapsed;
      saveNow();renderRight();
      break;
    }
    case 'jump-outline':{
      const lineIdx=parseInt(btn.dataset.line,10);
      jumpToLine(lineIdx);
      break;
    }
    case 'trash-copy':{
      const id=btn.dataset.id;
      const t=state.trash.find(x=>x.id===id);
      if(t){
        const text=t.content;
        const fallback=()=>{
          const ta=document.createElement('textarea');
          ta.value=text;
          ta.style.position='fixed';
          ta.style.opacity='0';
          document.body.appendChild(ta);
          ta.select();
          try{document.execCommand('copy');toast('已复制到剪贴板');}
          catch(_){toast('复制失败，请手动选择');}
          document.body.removeChild(ta);
        };
        if(navigator.clipboard&&navigator.clipboard.writeText){
          navigator.clipboard.writeText(text).then(()=>toast('已复制到剪贴板')).catch(fallback);
        }else{
          fallback();
        }
      }
      break;
    }
    case 'trash-insert':{
      const id=btn.dataset.id;
      const t=state.trash.find(x=>x.id===id);
      if(!t)break;
      const ch=getChapter();
      if(!ch){toast('请先选择章节');break;}
      const ed=$('#editor');
      const start=ed.selectionStart||0;
      const val=ed.value;
      const before=val.slice(0,start);
      const after=val.slice(start);
      const prefix=before&&!before.endsWith('\n')?'\n\n':'';
      const suffix=after&&!after.startsWith('\n')?'\n\n':'';
      const newVal=before+prefix+t.content+suffix+after;
      ed.value=newVal;
      ch.content=newVal;
      ch.updatedAt=Date.now();
      const pos=before.length+prefix.length+t.content.length+suffix.length;
      ed.setSelectionRange(pos,pos);
      ed.dispatchEvent(new Event('input'));
      toast('已插回到当前章节');
      break;
    }
    case 'trash-delete':{
      const id=btn.dataset.id;
      openConfirm('删除记录','确定要从回收站永久删除这条记录吗？',()=>{
        state.trash=state.trash.filter(x=>x.id!==id);
        saveNow();
        renderTab();
      });
      break;
    }
    case 'clear-trash':{
      openConfirm('清空回收站','将删除所有记录，不可恢复。确定吗？',()=>{
        state.trash=[];
        saveNow();
        renderTab();
      });
      break;
    }
    case 'new-idea': openIdeaEditor(null); break;
    case 'edit-idea': {
      const id = btn.dataset.id;
      const it = state.ideas.find(x => x.id === id);
      if (it) openIdeaEditor(it);
      break;
    }
    case 'toggle-idea': {
      e.stopPropagation();
      const id = btn.dataset.id;
      const it = state.ideas.find(x => x.id === id);
      if (!it) break;
      it.done = !it.done;
      if (it.done && (!it.usedIn || it.usedIn.length === 0)) {
        toast('已标记为已用，可在编辑里关联章节');
      }
      saveNow();
      renderTab();
      break;
    }
    case 'jump-idea-chapter': {
      e.stopPropagation();
      const wid = btn.dataset.wid;
      const cid = btn.dataset.cid;
      if (wid && cid) {
        state.currentWorkId = wid;
        state.currentChapterId = cid;
        loadChapterIntoEditor();
        saveNow();
        render();
      }
      break;
    }
    case 'open-graph':openRelationGraph();break;
    case 'open-check':openConsistencyCheck();break;
  }
});

/* ============================================================
   21. 章节拖拽排序
============================================================ */
document.addEventListener('dragstart',e=>{
  const item=e.target.closest('.chapter-item');
  if(!item)return;
  dragChapterId=item.dataset.chapter;
  item.classList.add('dragging');
  e.dataTransfer.effectAllowed='move';
  try{e.dataTransfer.setData('text/plain',dragChapterId);}catch(_){}
});
document.addEventListener('dragend',e=>{
  const item=e.target.closest('.chapter-item');
  if(item)item.classList.remove('dragging');
  document.querySelectorAll('.chapter-item.drag-over').forEach(x=>x.classList.remove('drag-over'));
  dragChapterId=null;
});
document.addEventListener('dragover',e=>{
  const item=e.target.closest('.chapter-item');
  if(!item||!dragChapterId||item.dataset.chapter===dragChapterId)return;
  e.preventDefault();
  document.querySelectorAll('.chapter-item.drag-over').forEach(x=>x.classList.remove('drag-over'));
  item.classList.add('drag-over');
});
document.addEventListener('drop',e=>{
  const item=e.target.closest('.chapter-item');
  if(!item||!dragChapterId)return;
  e.preventDefault();
  const targetId=item.dataset.chapter;
  if(targetId===dragChapterId){dragChapterId=null;return;}
  const work=getWork();
  if(!work)return;
  const from=work.chapters.findIndex(c=>c.id===dragChapterId);
  const to=work.chapters.findIndex(c=>c.id===targetId);
  if(from<0||to<0)return;
  const [moved]=work.chapters.splice(from,1);
  work.chapters.splice(to,0,moved);
  dragChapterId=null;
  item.classList.remove('drag-over');
  saveNow();render();
});

/* ============================================================
   24. 修订模式
============================================================ */
function lcsDiff(aLines, bLines) {
  const n = aLines.length, m = bLines.length;
  if (n * m > 4000000) {
    return [
      { type: 'del', value: aLines.join('\n') },
      { type: 'ins', value: bLines.join('\n') },
    ];
  }
  const dp = Array.from({ length: n + 1 }, () => new Uint32Array(m + 1));
  for (let i = 1; i <= n; i++) {
    for (let j = 1; j <= m; j++) {
      if (aLines[i - 1] === bLines[j - 1]) dp[i][j] = dp[i - 1][j - 1] + 1;
      else dp[i][j] = Math.max(dp[i - 1][j], dp[i][j - 1]);
    }
  }
  const result = [];
  let i = n, j = m;
  while (i > 0 && j > 0) {
    if (aLines[i - 1] === bLines[j - 1]) {
      result.unshift({ type: 'same', value: aLines[i - 1] });
      i--; j--;
    } else if (dp[i - 1][j] >= dp[i][j - 1]) {
      result.unshift({ type: 'del', value: aLines[i - 1] });
      i--;
    } else {
      result.unshift({ type: 'ins', value: bLines[j - 1] });
      j--;
    }
  }
  while (i > 0) { result.unshift({ type: 'del', value: aLines[i - 1] }); i--; }
  while (j > 0) { result.unshift({ type: 'ins', value: bLines[j - 1] }); j--; }
  return result;
}
function mergeDiff(ops) {
  const result = [];
  for (const op of ops) {
    if (result.length && result[result.length - 1].type === op.type) {
      result[result.length - 1].value += '\n' + op.value;
    } else {
      result.push({ ...op });
    }
  }
  return result;
}
function renderRevisionView() {
  const el = document.querySelector('#revisionView');
  if (!el) return;
  const ch = getChapter();
  if (!ch) {
    el.innerHTML = '<div class="empty-hint">请先选择一个章节</div>';
    return;
  }
  if (!ch.revisionBase) {
    el.innerHTML = `
      <div class="rev-toolbar">
        <span>还未开始追踪修订</span>
        <span style="margin-left:auto;display:flex;gap:6px">
          <button class="btn small primary" data-rev-action="start">开始追踪</button>
          <button class="btn small" data-rev-action="exit">返回编辑</button>
        </span>
      </div>
      <div class="rev-body"><div class="empty-hint">点「开始追踪」后，当前内容作为基准，之后的修改都会被记录。</div></div>
    `;
    return;
  }
  const base = ch.revisionBase.content || '';
  const current = ch.content || '';
  const ops = mergeDiff(lcsDiff(base.split('\n'), current.split('\n')));
  let addedChars = 0, removedChars = 0, addedLines = 0, removedLines = 0;
  ops.forEach(op => {
    if (op.type === 'ins') { addedChars += op.value.length; addedLines++; }
    if (op.type === 'del') { removedChars += op.value.length; removedLines++; }
  });
  const diffHTML = ops.map(op => {
    const v = esc(op.value);
    if (op.type === 'del') return `<span class="rev-del">${v}</span>`;
    if (op.type === 'ins') return `<span class="rev-ins">${v}</span>`;
    return v;
  }).join('');
  el.innerHTML = `
    <div class="rev-toolbar">
      <span>基准：${fmtTime(ch.revisionBase.time)}</span>
      <span class="rev-stat-add">+${addedChars} 字</span>
      <span class="rev-stat-del">−${removedChars} 字</span>
      <span style="font-size:11.5px;color:var(--text-3)">新增 ${addedLines} 段 · 删除 ${removedLines} 段</span>
      <span style="margin-left:auto;display:flex;gap:6px;flex-wrap:wrap">
        <button class="btn small" data-rev-action="accept">接受全部</button>
        <button class="btn small" data-rev-action="discard">放弃全部</button>
        <button class="btn small danger" data-rev-action="stop">停止追踪</button>
        <button class="btn small" data-rev-action="exit">返回编辑</button>
      </span>
    </div>
    <div class="rev-body">${diffHTML || '<span style="color:var(--text-3)">无差异</span>'}</div>
  `;
}

/* ============================================================
   26. 删稿回收站
============================================================ */

/* 内存中的章节基线快照，不持久化，只用于对比 */
const _chapterSnapshots = new Map();

/* 删除检测：逐行 LCS diff，抽出被删掉的行块 */
function detectDeletions(oldText, newText) {
  if (!oldText || oldText === newText) return [];
  const oldLines = oldText.split('\n');
  const newLines = newText.split('\n');
  const ops = lcsDiff(oldLines, newLines);
  const deletions = [];
  let current = null;
  const flush = () => {
    if (current !== null) {
      const trimmed = current.trim();
      if (trimmed.length >= 15) deletions.push(trimmed);
      current = null;
    }
  };
  for (const op of ops) {
    if (op.type === 'del') {
      if (current === null) current = op.value;
      else current += '\n' + op.value;
    } else {
      flush();
    }
  }
  flush();
  return deletions;
}

/* 将删除块写入回收站 */
function captureDeletionsForChapter(ch) {
  if (!ch) return;
  const work = state.works.find(w => w.chapters.includes(ch));
  if (!work) return;
  const last = _chapterSnapshots.get(ch.id) || '';
  const curr = ch.content || '';
  if (last === curr) return;

  const deletions = detectDeletions(last, curr);
  if (deletions.length) {
    deletions.forEach(text => {
      state.trash.unshift({
        id: uid(),
        content: text,
        workId: work.id,
        workTitle: work.title,
        chapterId: ch.id,
        chapterTitle: ch.title || '未命名',
        time: Date.now(),
      });
    });
    if (state.trash.length > 500) state.trash = state.trash.slice(0, 500);
    saveNow();
    if (prefs.tab === 'trash') renderTab();
  }
  _chapterSnapshots.set(ch.id, curr);
}

/* 从正文里提取 {{点子名}} 并自动关联到当前章节 */
function trackIdeaRefs(ch){
  if (!ch) return;
  const content = ch.content || '';
  const re = /\{\{(.+?)\}\}/g;
  let m;
  const refs = new Set();
  while ((m = re.exec(content))) {
    const name = m[1].trim();
    if (name) refs.add(name);
  }
  let changed = false;
  refs.forEach(name => {
    const idea = (state.ideas || []).find(i => i.title === name);
    if (!idea) return;
    if (idea.scope !== 'chapter') return; // 只在"本章"模式下自动关联
    if (!idea.usedIn) idea.usedIn = [];
    if (!idea.usedIn.includes(ch.id)) {
      idea.usedIn.push(ch.id);
      changed = true;
    }
  });
  if (changed) {
    saveNow();
    if (prefs.tab === 'ideas') renderTab();
    if (prefs.tab !== 'trash') scheduleRight();
  }
}

let deletionTimer = null;
function scheduleCaptureDeletions(ch) {
  clearTimeout(deletionTimer);
  deletionTimer = setTimeout(() => captureDeletionsForChapter(ch), 700);
}/* 回收站列表渲染 */

/* ============================================================
   28. 点子库
============================================================ */
let ideaFilter = { category: '', status: 'all' };
/* 判断某个点子对某章是否生效 */
function ideaAppliesToChapter(idea, chapterId){
  if (!idea || !chapterId) return false;
  if (idea.scope === 'global') return true;
  if (idea.scope === 'range') {
    const from = idea.rangeFrom;
    const to = idea.rangeTo;
    if (!from) return false;
    const work = getWork();
    if (!work) return false;
    const ids = work.chapters.map(c => c.id);
    const fi = ids.indexOf(from);
    const ti = to ? ids.indexOf(to) : ids.length - 1;
    const ci = ids.indexOf(chapterId);
    if (fi < 0 || ci < 0) return false;
    return ci >= fi && ci <= ti;
  }
  // chapter 模式：精确匹配 usedIn
  return (idea.usedIn || []).includes(chapterId);
}

  if (idea.scope === 'range') return { type: 'range', text: '持有' };
  if ((idea.usedIn || []).includes(chapterId)) return { type: 'chapter', text: '本章' };
  return null;
}

    <div class="modal-header">

      <label class="form-label">生效范围</label>
      <div class="scope-tabs">
        <div class="scope-tab ${it.scope==='chapter'?'active':''}" data-scope="chapter">本章</div>
        <div class="scope-tab ${it.scope==='global'?'active':''}" data-scope="global">全文</div>
        <div class="scope-tab ${it.scope==='range'?'active':''}" data-scope="range">范围</div>
      </div>

      <div id="scopeChapterPanel" style="display:${it.scope==='chapter'?'block':'none'}">
        <div class="idea-chapter-toolbar">
          <button type="button" data-bulk="all">全选</button>
          <button type="button" data-bulk="none">清空</button>
          <button type="button" data-bulk="current">只选当前章</button>
          <button type="button" data-bulk="invert">反选</button>
        </div>
        ${chapters.length ? `
          <div class="idea-chapters">
            ${chapters.map(c => `
              <label class="idea-chapter-item">
                <input type="checkbox" data-chapter-id="${c.id}" ${(it.usedIn||[]).includes(c.id)?'checked':''}>
                <span>${esc(c.title || '未命名')}<span class="wk">${esc(work.title)}</span></span>
              </label>
            `).join('')}
          </div>
        ` : '<div class="empty-hint">当前作品还没有章节</div>'}
      </div>

      <div id="scopeRangePanel" style="display:${it.scope==='range'?'block':'none'}">
        <label class="form-label">起始章节</label>
        <select class="modal-select" id="iRangeFrom">
          <option value="">— 请选择 —</option>
          ${chapters.map(c => `<option value="${c.id}" ${it.rangeFrom===c.id?'selected':''}>${esc(c.title||'未命名')}</option>`).join('')}
        </select>
        <label class="form-label">结束章节（留空表示持续到最后一章）</label>
        <select class="modal-select" id="iRangeTo">
          <option value="">— 持续到最后 —</option>
          ${chapters.map(c => `<option value="${c.id}" ${it.rangeTo===c.id?'selected':''}>${esc(c.title||'未命名')}</option>`).join('')}
        </select>
      </div>

      <div id="scopeGlobalPanel" style="display:${it.scope==='global'?'block':'none'}">
        <div class="help-tip" style="margin:8px 0">
          全文生效：打开任何章节，右侧栏都会显示这条点子。适合"主角始终持有的物品""主角天生会的能力"。
        </div>
      </div>

      <label class="form-label">标签（用逗号分隔）</label>
      <input class="modal-input" id="iTags" value="${esc((it.tags||[]).join('、'))}" placeholder="主角、装备、伏笔">
    </div>
    <div class="modal-actions">
      ${isNew ? '' : '<button class="btn danger" id="delIdea">删除</button>'}
      <button class="btn" data-close>取消</button>
      <button class="btn primary" id="saveIdea">保存</button>
    </div>
  `, root => {
    root.querySelectorAll('.scope-tab').forEach(tab => {
      tab.onclick = () => {
        root.querySelectorAll('.scope-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        const s = tab.dataset.scope;
        root.querySelector('#scopeChapterPanel').style.display = s === 'chapter' ? 'block' : 'none';
        root.querySelector('#scopeRangePanel').style.display = s === 'range' ? 'block' : 'none';
        root.querySelector('#scopeGlobalPanel').style.display = s === 'global' ? 'block' : 'none';
      };
    });

    root.querySelectorAll('[data-bulk]').forEach(btn => {
      btn.onclick = () => {
        const mode = btn.dataset.bulk;
        const boxes = root.querySelectorAll('[data-chapter-id]');
        boxes.forEach(cb => {
          if (mode === 'all') cb.checked = true;
          else if (mode === 'none') cb.checked = false;
          else if (mode === 'invert') cb.checked = !cb.checked;
          else if (mode === 'current') {
            cb.checked = (cb.dataset.chapterId === state.currentChapterId);
          }
        });
      };
    });

    root.querySelector('#saveIdea').onclick = () => {
      const title = root.querySelector('#iTitle').value.trim();
      if (!title) { alert('请填写标题'); return; }
      it.title = title;
      it.category = root.querySelector('#iCategory').value;
      it.content = root.querySelector('#iContent').value;
      it.done = root.querySelector('#iDone').checked;
      it.tags = root.querySelector('#iTags').value.split(/[、,，]/).map(s => s.trim()).filter(Boolean);

      const activeScope = root.querySelector('.scope-tab.active');
      it.scope = activeScope ? activeScope.dataset.scope : 'chapter';

      const usedIn = [];
      root.querySelectorAll('[data-chapter-id]').forEach(cb => {
        if (cb.checked) usedIn.push(cb.dataset.chapterId);
      });
      it.usedIn = usedIn;

      const fromEl = root.querySelector('#iRangeFrom');
      const toEl = root.querySelector('#iRangeTo');
      it.rangeFrom = fromEl ? (fromEl.value || null) : null;
      it.rangeTo = toEl ? (toEl.value || null) : null;

      if (it.scope === 'range' && !it.rangeFrom) {
        alert('范围模式需要选择起始章节');
        return;
      }

      it.updatedAt = Date.now();
      if (isNew) state.ideas.push(it);
      else {
        const idx = state.ideas.findIndex(x => x.id === it.id);
        if (idx >= 0) state.ideas[idx] = it;
      }
      saveNow();
      closeModal();
      render();
      toast(isNew ? '已新建点子' : '已保存');
    };

    const delBtn = root.querySelector('#delIdea');
    if (delBtn) {
      delBtn.onclick = () => {
        openConfirm('删除点子', `确定删除「${it.title}」吗？`, () => {
          state.ideas = state.ideas.filter(x => x.id !== it.id);
          saveNow();
          closeModal();
          render();
        });
      };
    }
  });
}

/* ============================================================
   27. 侧栏拖动
============================================================ */
function initResizers(){  const sidebar=document.querySelector('#sidebar');
  const rightbar=document.querySelector('#rightbar');
  const resizerLeft=document.querySelector('#resizerLeft');
  const resizerRight=document.querySelector('#resizerRight');
  if(!sidebar||!rightbar||!resizerLeft||!resizerRight)return;

  function startDrag(resizer,target,side){
    let startX=0,startWidth=0,dragging=false;

    function onMove(ev){
      if(!dragging)return;
      const delta=side==='left'?ev.clientX-startX:startX-ev.clientX;
      let w=startWidth+delta;
      if(side==='left')w=Math.max(160,Math.min(520,w));
      else w=Math.max(140,Math.min(520,w));
      target.style.width=w+'px';
      if(side==='left')prefs.sidebarWidth=w;
      else prefs.rightbarWidth=w;
    }

    function onUp(){
      if(!dragging)return;
      dragging=false;
      resizer.classList.remove('dragging');
      document.body.style.cursor='';
      document.body.style.userSelect='';
      document.removeEventListener('mousemove',onMove);
      document.removeEventListener('mouseup',onUp);
      saveNow();
    }

    resizer.addEventListener('mousedown',e=>{
      if(window.innerWidth<=768)return;
      e.preventDefault();
      dragging=true;
      startX=e.clientX;
      startWidth=target.offsetWidth;
      resizer.classList.add('dragging');
      document.body.style.cursor='col-resize';
      document.body.style.userSelect='none';
      document.addEventListener('mousemove',onMove);
      document.addEventListener('mouseup',onUp);
    });

    resizer.addEventListener('dblclick',e=>{
      e.preventDefault();
      const def=side==='left'?240:210;
      target.style.width=def+'px';
      if(side==='left')prefs.sidebarWidth=def;
      else prefs.rightbarWidth=def;
      saveNow();
      toast('已恢复默认宽度');
    });
  }

  startDrag(resizerLeft,sidebar,'left');
  startDrag(resizerRight,rightbar,'right');

  function applySavedWidths(){
    if(window.innerWidth<=768){
      sidebar.style.width='';
      rightbar.style.width='';
      return;
    }
    if(prefs.sidebarWidth)sidebar.style.width=prefs.sidebarWidth+'px';
    if(prefs.rightbarWidth)rightbar.style.width=prefs.rightbarWidth+'px';
  }
  applySavedWidths();

  window.addEventListener('resize',applySavedWidths);
}

initResizers();

/* ============================================================
   29. 小黑屋
============================================================ */
function getLockdownElapsed(){
  const ld = prefs.lockdown;
  if (!ld || !ld.active) return { words:0, minutes:0, done:false };
  const totalWords = getAllWords();
  const words = Math.max(0, totalWords - ld.startWords);
  const minutes = (Date.now() - ld.startTime) / 60000;
  const wordsDone = !ld.targetWords || words >= ld.targetWords;
  const timeDone = !ld.targetMinutes || minutes >= ld.targetMinutes;
  return { words, minutes, done: wordsDone && timeDone };
}

function updateLockdownBar(){
  const ld = prefs.lockdown;
  if (!ld || !ld.active) return;
  const { words, minutes, done } = getLockdownElapsed();
  const parts = [];
  if (ld.targetWords) parts.push(`${words} / ${ld.targetWords} 字`);
  if (ld.targetMinutes) parts.push(`${Math.floor(minutes)} / ${ld.targetMinutes} 分钟`);
  const el = document.querySelector('#lockdownProgress');
  if (el) el.textContent = parts.join(' · ');
  if (done) {
    prefs.lockdown.active = false;
    saveNow();
    applyLockdown();
    openConfirm('🎉 出关了！', '恭喜完成小黑屋目标！', ()=>{}, false);
    render();
  }
}

function applyLockdown(){
  const ld = prefs.lockdown;
  if (ld && ld.active) {
    // 超过 6 小时自动过期
    const hours = (Date.now() - (ld.startTime || 0)) / 3600000;
    if (hours > 6 || !ld.startTime) {
      prefs.lockdown.active = false;
      saveNow();
      document.body.classList.remove('lockdown');
      return;
    }
    document.body.classList.add('lockdown');
    updateLockdownBar();
  } else {
    document.body.classList.remove('lockdown');
  }
}
function openLockdownPanel(){
  const ld = prefs.lockdown || {};
  openModal(`
    <div class="modal-header">
      <h3>🔒 小黑屋</h3>
      <button class="icon-btn" data-close style="opacity:1">✕</button>
    </div>

      <p class="modal-text">设定一个目标，写不完就出不去。适合"今晚必须写完 2000 字"。</p>

      <label class="form-label">字数目标（0 = 不限）</label>
      <input class="modal-input" id="ldWords" type="number" min="0" value="${ld.targetWords||1000}">

      <label class="form-label">时间目标（分钟，0 = 不限）</label>
      <input class="modal-input" id="ldMinutes" type="number" min="0" value="${ld.targetMinutes||0}">

      <label class="form-label">紧急退出密码</label>
      <input class="modal-input" id="ldPassword" value="${esc(ld.password||'8888')}">

      <div class="help-tip" style="margin-top:12px">
        · 至少设定一个目标<br>

        · 达到目标会自动解锁<br>
        · 输入密码可以提前退出
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn" data-close>取消</button>
      <button class="btn primary" id="ldStart">进入小黑屋</button>
    </div>
  `, root => {
    root.querySelector('#ldStart').onclick = () => {
      const w = parseInt(root.querySelector('#ldWords').value, 10) || 0;
      const m = parseInt(root.querySelector('#ldMinutes').value, 10) || 0;
      const p = root.querySelector('#ldPassword').value.trim() || '8888';
      if (!w && !m) { alert('至少设定字数或时间'); return; }
      prefs.lockdown = {
        active: true,
        startTime: Date.now(),
        startWords: getAllWords(),
        targetWords: w,
        targetMinutes: m,
        password: p,
      };
      saveNow();
      closeModal();
      applyLockdown();
      render();
      toast('🔒 小黑屋已开启');
    };
  });
}

  document.documentElement.style.setProperty('--accent-soft', p.light);

    d.classList.toggle('active', d.dataset.themeColor === color);
  });
}

(function setupPWA(){
  const iconSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><defs><linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#6366f1"/><stop offset="100%" stop-color="#a855f7"/></linearGradient></defs><rect width="512" height="512" rx="112" fill="url(#g)"/><path d="M 96 128 Q 256 96 256 128 L 256 384 Q 256 352 96 384 Z" fill="#fff" opacity="0.95"/><path d="M 416 128 Q 256 96 256 128 L 256 384 Q 256 352 416 384 Z" fill="#fff" opacity="0.85"/><line x1="256" y1="128" x2="256" y2="384" stroke="#6366f1" stroke-width="6"/></svg>`;
  const iconDataUri = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(iconSvg);

  const manifest = {
    name: '写作台',
    short_name: '写作台',
    description: '本地写作工具',
    start_url: './',
    scope: './',
    display: 'standalone',
    orientation: 'portrait',
    background_color: '#f7f7f9',
    theme_color: '#6366f1',
    lang: 'zh-CN',
    icons: [
      { src: iconDataUri, sizes: '192x192', type: 'image/svg+xml', purpose: 'any' },
      { src: iconDataUri, sizes: '512x512', type: 'image/svg+xml', purpose: 'any' },
      { src: iconDataUri, sizes: '512x512', type: 'image/svg+xml', purpose: 'maskable' },
    ],
  };

  try {
    const manifestDataUri = 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifest));
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = manifestDataUri;
    document.head.appendChild(link);
  } catch (e) {
    console.warn('manifest 注入失败', e);
  }

  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    const swCode = `
      const CACHE = 'writer-app-v1';
      self.addEventListener('install', e => {
        self.skipWaiting();
      });
      self.addEventListener('activate', e => {
        e.waitUntil(
          caches.keys().then(keys =>
            Promise.all(keys.filter(k => k !== CACHE).map(k => caches.delete(k)))
          ).then(() => self.clients.claim())
        );
      });
      self.addEventListener('fetch', e => {
        if (e.request.method !== 'GET') return;
        e.respondWith(
          fetch(e.request).then(res => {
            if (res && res.status === 200 && res.type === 'basic') {
              const copy = res.clone();
              caches.open(CACHE).then(c => c.put(e.request, copy)).catch(() => {});
            }
            return res;
          }).catch(() => caches.match(e.request).then(r => r || caches.match('./')))
        );
      });
    `;
    try {
      const blob = new Blob([swCode], { type: 'application/javascript' });
      const swUrl = URL.createObjectURL(blob);
      navigator.serviceWorker.register(swUrl, { scope: './' }).catch(err => {
        console.warn('SW 注册失败（不影响使用）', err);
      });
    } catch (e) {
      console.warn('SW 初始化失败', e);
    }
  }
})();
