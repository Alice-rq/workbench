<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f7cff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="今天做什么">
<title>今天做什么 · 转盘</title>
<style>
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root{
    --bg:#f4f6f9; --card:#ffffff; --line:#e8ebf1;
    --text:#222833; --strong:#1b2230; --muted:#8a93a6;
    --input:#f7f8fb; --hover:#f5f7fb;
    --accent:#4f7cff; --green:#16a34a; --red:#dc2626;
    --amber:#b45309; --amber-bg:rgba(245,158,11,.12);
    --shadow:0 1px 2px rgba(16,24,40,.04), 0 10px 30px -18px rgba(16,24,40,.25);
  }
  :root[data-theme="dark"]{
    --bg:#0f1117; --card:#181b24; --line:#262b38;
    --text:#e6e9f0; --strong:#f5f7fb; --muted:#8b94a7;
    --input:#1f232e; --hover:#1f232e;
    --accent:#5b85ff; --green:#22c55e; --red:#f87171;
    --amber:#fbbf24; --amber-bg:rgba(245,158,11,.18);
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px -18px rgba(0,0,0,.6);
  }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased; min-height:100vh;
    padding:14px; touch-action:manipulation;
    transition:background .25s, color .25s;
    padding-bottom:calc(14px + env(safe-area-inset-bottom));
    padding-top:calc(14px + env(safe-area-inset-top));
  }
  .wrap{ max-width:1020px; margin:0 auto; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); transition:background .25s, border-color .25s; }

  /* 备份横幅 */
  .backup-banner{
    display:flex; align-items:center; gap:8px;
    padding:9px 13px; border-radius:12px;
    background:var(--amber-bg); border:1px solid rgba(245,158,11,.35);
    color:var(--amber); font-size:12.5px; font-weight:600;
    margin-bottom:12px; line-height:1.4; flex-wrap:wrap;
  }
  .backup-banner[hidden]{ display:none; }
  .backup-banner .txt{ flex:1; min-width:0; }
  .backup-banner .hint{ font-weight:400; opacity:.85; font-size:11.5px; }
  .backup-banner .mini-btn{ padding:5px 10px; font-size:11.5px; background:transparent; border-color:rgba(245,158,11,.4); color:var(--amber); }
  .backup-banner .mini-btn:hover{ background:rgba(245,158,11,.12); color:var(--amber); }

  /* 顶栏 */
  .topbar{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 14px; margin-bottom:12px; flex-wrap:wrap; }
  .score-area{ display:flex; align-items:center; gap:12px; min-width:0; flex-wrap:wrap; }
  .score-item{ display:flex; align-items:baseline; gap:5px; }
  .score-label{ font-size:11px; color:var(--muted); }
  .score-value{ font-size:19px; font-weight:800; line-height:1; font-variant-numeric:tabular-nums; color:var(--strong); transition:color .25s; }
  .score-value.total{ font-size:15px; color:var(--muted); }
  .score-value.streak{ font-size:15px; color:#f59e0b; }
  .score-value.plus{ color:var(--green) !important; }
  .score-value.minus{ color:var(--red) !important; }
  .score-sep{ width:1px; height:16px; background:var(--line); }
  .topbar-actions{ display:flex; gap:5px; flex-shrink:0; }
  .mini-btn{ padding:6px 10px; border-radius:9px; border:1px solid var(--line); background:var(--card); color:var(--muted); font-family:inherit; font-size:12.5px; font-weight:600; cursor:pointer; white-space:nowrap; transition:background .15s, color .15s, border-color .15s; }
  .mini-btn:hover{ background:var(--hover); color:var(--text); }
  .mini-btn:disabled{ opacity:.35; cursor:default; }
  .mini-btn.accent{ color:var(--accent); border-color:rgba(79,124,255,.35); }

  .app{ display:grid; grid-template-columns:minmax(0,1fr) minmax(310px,390px); gap:12px; align-items:start; }

  /* 转盘 */
  .wheel-area{ padding:16px; display:flex; flex-direction:column; align-items:center; gap:12px; min-width:0; }
  .wheel-box{ position:relative; width:100%; max-width:400px; aspect-ratio:1/1; }
  .wheel-box canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; border-radius:50%; }
  .pointer{ position:absolute; top:-4px; left:50%; transform:translateX(-50%); width:0; height:0; border-left:12px solid transparent; border-right:12px solid transparent; border-top:24px solid #ff5a76; filter:drop-shadow(0 3px 5px rgba(255,90,118,.35)); z-index:3; pointer-events:none; }
  .spin-btn{ position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:26%; aspect-ratio:1/1; border-radius:50%; border:4px solid #fff; background:var(--accent); color:#fff; font-family:inherit; font-size:clamp(13px,3vw,17px); font-weight:800; letter-spacing:1px; cursor:pointer; z-index:2; box-shadow:0 8px 20px rgba(79,124,255,.35); transition:transform .15s ease, filter .2s, background .25s; }
  .spin-btn:hover:not(:disabled){ transform:translate(-50%,-50%) scale(1.05); }
  .spin-btn:active:not(:disabled){ transform:translate(-50%,-50%) scale(.94); }
  .spin-btn:disabled{ cursor:default; }
  .spin-btn:disabled:not(.locked){ filter:grayscale(.5) opacity(.75); }
  .spin-btn.locked{ background:#94a3b8; box-shadow:0 8px 20px rgba(100,116,139,.35); font-size:clamp(18px,4vw,26px); letter-spacing:0; }
  .result{ margin:0; text-align:center; font-size:14px; color:var(--muted); min-height:22px; line-height:1.5; }
  .result b{ color:var(--strong); font-size:17px; }
  .result.pop{ animation:pop .4s cubic-bezier(.2,1.5,.4,1); }
  @keyframes pop{ from{ transform:scale(.9); opacity:.3; } to{ transform:scale(1); opacity:1; } }
  .lock-hint{ width:100%; padding:8px 12px; border-radius:10px; background:var(--amber-bg); border:1px solid rgba(245,158,11,.35); color:var(--amber); font-size:12.5px; font-weight:600; text-align:center; line-height:1.4; display:flex; align-items:center; justify-content:center; gap:6px; }
  .lock-hint[hidden]{ display:none; }
  .checkin-btn{ width:100%; padding:12px; border:none; border-radius:13px; font-family:inherit; font-size:15px; font-weight:800; letter-spacing:.5px; cursor:pointer; color:#fff; background:linear-gradient(135deg,#4ade80,#22c55e); box-shadow:0 6px 16px rgba(34,197,94,.28); transition:transform .12s, box-shadow .2s; }
  .checkin-btn:active:not(:disabled){ transform:scale(.98); }
  .checkin-btn:disabled{ opacity:.5; cursor:default; }
  .checkin-btn.negative{ background:linear-gradient(135deg,#fb7185,#ef4444); box-shadow:0 6px 16px rgba(239,68,68,.28); }
  .checkin-btn.neutral{ background:linear-gradient(135deg,#94a3b8,#64748b); box-shadow:0 6px 16px rgba(100,116,139,.25); }
  .checkin-btn.done{ background:var(--input); color:var(--muted); box-shadow:none; cursor:default; }
  .checkin-btn.hint{ animation:hintPulse 1.1s ease-in-out infinite; }
  @keyframes hintPulse{ 0%,100%{ box-shadow:0 6px 16px rgba(34,197,94,.28); } 50%{ box-shadow:0 6px 24px rgba(34,197,94,.6); } }

  .panel{ display:flex; flex-direction:column; gap:12px; min-width:0; }
  .timer-card{ padding:15px; }
  .timer-top{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:2px; }
  .timer-label{ font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; min-width:0; }
  .timer-state{ font-size:10.5px; font-weight:700; letter-spacing:.5px; color:var(--accent); background:rgba(79,124,255,.12); padding:3px 8px; border-radius:99px; flex-shrink:0; }
  .timer-state.off{ color:var(--muted); background:var(--input); }
  .timer-state.ok{ color:var(--green); background:rgba(22,163,74,.12); }
  .timer-state.lock{ color:var(--amber); background:var(--amber-bg); }
  .timer-display{ font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:clamp(38px,9.5vw,48px); font-weight:800; letter-spacing:1px; font-variant-numeric:tabular-nums; line-height:1.2; text-align:center; color:var(--strong); }
  .bar{ height:6px; border-radius:99px; background:var(--input); overflow:hidden; margin:10px 0 12px; }
  .bar > i{ display:block; height:100%; width:0; background:linear-gradient(90deg,#7ea8ff,var(--accent)); border-radius:99px; transition:width .15s linear; }
  @keyframes flash{ 0%,100%{ box-shadow:var(--shadow); } 50%{ box-shadow:0 0 0 4px rgba(255,90,118,.3), var(--shadow); } }
  .timer-card.done{ animation:flash .6s ease 5; }
  .tbtns{ display:flex; gap:7px; }
  .btn{ flex:1; padding:9px 5px; border-radius:11px; border:1px solid var(--line); background:var(--card); color:var(--text); font-family:inherit; font-size:13px; font-weight:600; cursor:pointer; white-space:nowrap; transition:background .15s, transform .1s, border-color .15s; }
  .btn:hover{ background:var(--hover); }
  .btn:active{ transform:scale(.97); }
  .btn.primary{ background:var(--accent); border-color:var(--accent); color:#fff; box-shadow:0 4px 12px rgba(79,124,255,.28); }
  .btn.primary:hover{ filter:brightness(1.07); }
  .btn.danger{ color:var(--red); border-color:rgba(220,38,38,.35); background:transparent; }
  .btn.danger:hover{ background:rgba(220,38,38,.08); }

  .settings{ padding:15px; }
  .card-title{ font-size:13.5px; font-weight:700; display:flex; align-items:baseline; justify-content:space-between; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
  .card-title .hint{ font-size:11px; color:var(--muted); font-weight:400; }
  .head{ display:grid; grid-template-columns:26px minmax(0,1fr) 40px 40px 40px 22px; gap:5px; font-size:11px; color:var(--muted); padding:0 2px 6px; letter-spacing:.3px; }
  .head span:nth-child(3), .head span:nth-child(4), .head span:nth-child(5){ text-align:center; }
  .list{ max-height:min(44vh,360px); overflow-y:auto; padding-right:2px; -webkit-overflow-scrolling:touch; }
  .list::-webkit-scrollbar{ width:5px; }
  .list::-webkit-scrollbar-thumb{ background:var(--line); border-radius:99px; }
  .group-label{ font-size:11px; font-weight:700; color:var(--muted); padding:8px 4px 4px; letter-spacing:.5px; text-transform:uppercase; display:flex; align-items:center; gap:6px; }
  .group-label::after{ content:''; flex:1; height:1px; background:var(--line); }
  .group-label:first-child{ padding-top:2px; }
  .row{ display:grid; grid-template-columns:26px minmax(0,1fr) 40px 40px 40px 22px; gap:5px; align-items:center; padding:4px 2px; border-radius:9px; position:relative; transition:background .15s, opacity .2s; }
  .row:hover{ background:var(--hover); }
  .row.disabled{ opacity:.4; }
  .row.disabled .nm{ text-decoration:line-through; text-decoration-color:var(--muted); }
  .row.dragging{ opacity:.25; }
  .row.just-moved{ animation:rowPop .4s ease; }
  @keyframes rowPop{ 0%{ background:rgba(79,124,255,.15); } 100%{ background:transparent; } }
  .handle{ display:flex; align-items:center; justify-content:center; height:24px; color:var(--muted); opacity:.5; cursor:grab; touch-action:none; user-select:none; font-size:12px; letter-spacing:-2px; border-radius:6px; transition:background .15s, opacity .15s; }
  .handle:hover{ background:var(--input); opacity:1; }
  .handle:active{ cursor:grabbing; }
  .cell-left{ display:flex; align-items:center; gap:6px; min-width:0; }
  .dot{ width:10px; height:10px; border-radius:50%; flex-shrink:0; box-shadow:inset 0 0 0 1px rgba(0,0,0,.08); }
  .nm{ font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; cursor:pointer; padding:2px 0; border-bottom:1px dashed transparent; transition:border-color .15s; min-width:0; }
  .nm:hover{ border-bottom-color:var(--muted); }
  input[type=number]{ width:100%; padding:5px 2px; border-radius:8px; border:1px solid var(--line); background:var(--input); color:var(--text); font-family:inherit; font-size:12.5px; font-weight:700; text-align:center; font-variant-numeric:tabular-nums; -moz-appearance:textfield; appearance:textfield; min-width:0; transition:border-color .15s, background .15s, box-shadow .15s; }
  input[type=number]::-webkit-outer-spin-button, input[type=number]::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  input[type=number]:focus{ outline:none; border-color:var(--accent); background:var(--card); box-shadow:0 0 0 3px rgba(79,124,255,.15); }
  input[type=number].pos{ color:var(--green); }
  input[type=number].neg{ color:var(--red); }
  .eye-btn{ width:22px; height:22px; border-radius:6px; border:none; background:transparent; color:var(--muted); font-size:12px; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0; transition:background .15s, color .15s; }
  .eye-btn:hover{ background:var(--input); color:var(--text); }
  .eye-btn.off{ color:#c3cad6; }
  .empty-tip{ text-align:center; color:var(--muted); font-size:13px; padding:24px 0; }
  .list-actions{ display:flex; gap:5px; margin-top:10px; flex-wrap:wrap; }
  .list-actions .btn{ flex:1 1 auto; min-width:0; font-size:12px; padding:7px 4px; }

  .float{ position:fixed; font-size:19px; font-weight:900; pointer-events:none; z-index:200; animation:floatUp 1s cubic-bezier(.2,.8,.3,1) forwards; font-variant-numeric:tabular-nums; }
  .float.up{ color:var(--green); }
  .float.down{ color:var(--red); }
  @keyframes floatUp{ 0%{ opacity:0; transform:translateY(6px) scale(.8); } 18%{ opacity:1; transform:translateY(0) scale(1.1); } 100%{ opacity:0; transform:translateY(-46px) scale(1.2); } }

  .overlay{ position:fixed; inset:0; background:rgba(15,17,23,.5); display:flex; align-items:center; justify-content:center; padding:14px; z-index:100; backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px); animation:fadeIn .18s ease; }
  @keyframes fadeIn{ from{ opacity:0; } to{ opacity:1; } }
  .overlay[hidden]{ display:none; }
  .dialog{ width:100%; max-width:400px; max-height:85vh; display:flex; flex-direction:column; padding:0; overflow:hidden; animation:slideUp .22s cubic-bezier(.2,.9,.3,1); }
  @keyframes slideUp{ from{ transform:translateY(16px); opacity:.6; } to{ transform:translateY(0); opacity:1; } }
  .dialog.wide{ max-width:480px; }
  .dialog-head{ display:flex; align-items:center; justify-content:space-between; padding:13px 16px; border-bottom:1px solid var(--line); flex-shrink:0; }
  .dialog-head h3{ margin:0; font-size:14.5px; }
  .close-btn{ width:28px; height:28px; border-radius:8px; border:none; background:var(--input); color:var(--muted); font-size:13px; cursor:pointer; transition:background .15s; }
  .close-btn:hover{ background:var(--line); }
  .dialog-body{ padding:14px 16px; overflow-y:auto; display:flex; flex-direction:column; gap:12px; }
  .dialog-foot{ display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--line); flex-shrink:0; }
  .dialog-foot .btn{ flex:1; }
  .field{ display:flex; flex-direction:column; gap:5px; }
  .field label{ font-size:11.5px; color:var(--muted); font-weight:600; }
  .field input[type=text], .field select{ width:100%; padding:9px 11px; border-radius:10px; border:1px solid var(--line); background:var(--input); color:var(--text); font-family:inherit; font-size:13.5px; font-weight:600; transition:border-color .15s, background .15s, box-shadow .15s; }
  .field input[type=text]:focus, .field select:focus{ outline:none; border-color:var(--accent); background:var(--card); box-shadow:0 0 0 3px rgba(79,124,255,.15); }
  .field-row{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:9px; }
  .color-row{ display:flex; align-items:center; gap:9px; }
  .color-row input[type=color]{ width:42px; height:36px; padding:0; border:1px solid var(--line); border-radius:9px; background:var(--card); cursor:pointer; }
  .color-presets{ display:flex; gap:4px; flex-wrap:wrap; flex:1; }
  .preset{ width:22px; height:22px; border-radius:6px; cursor:pointer; border:2px solid transparent; transition:transform .12s, border-color .15s; }
  .preset:hover{ transform:scale(1.13); }
  .preset.active{ border-color:var(--accent); }
  .switch-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:3px 0; }
  .switch-row .lbl{ font-size:13.5px; font-weight:600; }
  .switch-row .sub{ font-size:11px; color:var(--muted); margin-top:2px; }
  .switch{ position:relative; width:42px; height:24px; flex-shrink:0; border-radius:99px; background:var(--line); cursor:pointer; transition:background .2s; border:none; padding:0; }
  .switch.on{ background:var(--accent); }
  .switch::after{ content:''; position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:50%; background:#fff; transition:transform .2s; box-shadow:0 1px 3px rgba(0,0,0,.25); }
  .switch.on::after{ transform:translateX(18px); }
  input[type=range]{ -webkit-appearance:none; appearance:none; width:100%; height:4px; border-radius:99px; background:var(--line); outline:none; margin:8px 0 4px; }
  input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; appearance:none; width:18px; height:18px; border-radius:50%; background:var(--accent); cursor:pointer; box-shadow:0 2px 6px rgba(79,124,255,.4); }
  input[type=range]::-moz-range-thumb{ width:18px; height:18px; border-radius:50%; border:none; background:var(--accent); cursor:pointer; }
  .history{ overflow-y:auto; padding:4px 6px 10px; }
  .history-item{ display:flex; align-items:center; gap:9px; padding:9px 10px; border-radius:9px; font-size:13px; }
  .history-item:hover{ background:var(--hover); }
  .history-delta{ font-weight:800; font-variant-numeric:tabular-nums; min-width:42px; text-align:right; }
  .history-delta.up{ color:var(--green); }
  .history-delta.down{ color:var(--red); }
  .history-delta.zero{ color:var(--muted); }
  .history-name{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .history-time{ color:var(--muted); font-size:11px; flex-shrink:0; }
  .stats-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:9px; }
  .stat-box{ padding:12px; border-radius:11px; background:var(--input); text-align:center; }
  .stat-num{ font-size:22px; font-weight:800; color:var(--strong); font-variant-numeric:tabular-nums; line-height:1.1; }
  .stat-num.green{ color:var(--green); }
  .stat-num.amber{ color:#f59e0b; }
  .stat-num.blue{ color:var(--accent); }
  .stat-lbl{ font-size:11px; color:var(--muted); margin-top:4px; }
  .week-chart{ display:flex; align-items:flex-end; justify-content:space-between; gap:6px; height:110px; padding:8px 4px 0; }
  .week-col{ flex:1; display:flex; flex-direction:column; align-items:center; gap:5px; height:100%; justify-content:flex-end; }
  .week-bar-wrap{ flex:1; width:100%; display:flex; align-items:flex-end; justify-content:center; position:relative; }
  .week-bar{ width:70%; max-width:22px; min-height:3px; border-radius:5px 5px 2px 2px; background:linear-gradient(180deg,#7ea8ff,var(--accent)); transition:height .3s ease; }
  .week-bar.neg{ background:linear-gradient(180deg,#fca5a5,var(--red)); }
  .week-bar.zero{ background:var(--line); }
  .week-lbl{ font-size:10px; color:var(--muted); }
  .week-val{ font-size:9.5px; color:var(--muted); font-variant-numeric:tabular-nums; height:12px; }
  .stat-list{ display:flex; flex-direction:column; gap:4px; }
  .stat-line{ display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:9px; font-size:13px; }
  .stat-line:hover{ background:var(--hover); }
  .stat-line .dot{ width:9px; height:9px; }
  .stat-line .nm{ flex:1; min-width:0; }
  .stat-line .num{ font-variant-numeric:tabular-nums; color:var(--muted); font-size:12px; }
  .confirm-icon{ font-size:44px; text-align:center; line-height:1; margin-bottom:4px; }
  .confirm-title{ font-size:17px; font-weight:800; text-align:center; color:var(--strong); margin-bottom:5px; }
  .confirm-sub{ font-size:13px; color:var(--muted); text-align:center; line-height:1.5; }
  .confirm-points{ font-size:22px; font-weight:900; text-align:center; margin:8px 0 2px; font-variant-numeric:tabular-nums; }
  .confirm-points.up{ color:var(--green); }
  .confirm-points.down{ color:var(--red); }
  .confirm-points.zero{ color:var(--muted); }

  /* 同步 UI */
  .sync-section{ display:flex; flex-direction:column; gap:10px; padding:12px; border-radius:12px; background:var(--input); border:1px solid var(--line); }
  .sync-header{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .sync-header .lbl{ font-size:13.5px; font-weight:700; display:flex; align-items:center; gap:6px; }
  .sync-dot{ width:8px; height:8px; border-radius:50%; background:#c3cad6; }
  .sync-dot.on{ background:var(--green); box-shadow:0 0 6px rgba(22,163,74,.5); }
  .sync-desc{ font-size:11.5px; color:var(--muted); line-height:1.5; }
  .sync-id-row{ display:flex; align-items:center; gap:6px; padding:8px 10px; border-radius:9px; background:var(--card); border:1px solid var(--line); }

<script>
(function () {
  'use strict';

  const TAU = Math.PI * 2;
  const STORAGE_KEY = 'wheel-config-v6';
   const EXPORT_KEY = 'wheel-last-export';
  const PULL_KEY = 'wheel-last-pull';
  const $ = id => document.getElementById(id);

  const DEFAULTS = [
    { name:'学习遴选',     group:'学习', weight:1, minutes:25, points:10,  color:'#FFC2C2' },
    { name:'学习日语',     group:'学习', weight:1, minutes:25, points:10,  color:'#FFD9B0' },
    { name:'学习尤克里里', group:'学习', weight:1, minutes:25, points:10,  color:'#FFE9A8' },
    { name:'学习服装设计', group:'学习', weight:1, minutes:25, points:10,  color:'#DBF0B4' },
    { name:'学习编程',     group:'学习', weight:1, minutes:25, points:10,  color:'#B7E4C7' },
    { name:'写文',         group:'学习', weight:1, minutes:30, points:10,  color:'#A9E3DC' },
    { name:'打电脑游戏',   group:'娱乐', weight:1, minutes:0,  points:-5,  color:'#B4DCF7' },
    { name:'打Ns游戏',     group:'娱乐', weight:1, minutes:0,  points:-5,  color:'#C0C8F5' },
    { name:'运动',         group:'生活', weight:1, minutes:30, points:10,  color:'#D3C2F0' },
    { name:'看小说',       group:'娱乐', weight:1, minutes:0,  points:-3,  color:'#EFC5EC' },
    { name:'看视频',       group:'娱乐', weight:1, minutes:0,  points:-5,  color:'#FBC7D8' },
    { name:'睡觉',         group:'生活', weight:1, minutes:0,  points:0,   color:'#E2E5EC' }
  ];
  const PALETTE = ['#FFC2C2','#FFD9B0','#FFE9A8','#DBF0B4','#B7E4C7','#A9E3DC','#B4DCF7','#C0C8F5','#D3C2F0','#EFC5EC','#FBC7D8','#E2E5EC','#FF8A8A','#FFB37B','#FFD86B','#B8E986','#7ED9A6','#7BC8D9','#7EA8FF','#A39BFF','#C89BFF','#FF9BC8','#FF9B9B','#C9CDD6'];

  let uidSeed = 0;
  const uid = () => 'a' + Date.now().toString(36) + (++uidSeed).toString(36) + Math.random().toString(36).slice(2,5);
  const num = (v,min,max,fb) => { const n=parseFloat(v); return isFinite(n)?Math.max(min,Math.min(max,n)):fb; };
  const pickColor = i => PALETTE[i % PALETTE.length];
  const isValidColor = c => typeof c==='string' && /^#[0-9a-fA-F]{6}$/.test(c);
  const dateStr = d => { const p = n => String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); };
  const tsToDateStr = ts => dateStr(new Date(ts));
  const todayStr = () => dateStr(new Date());

  let state = loadState();
  let rotation = 0, spinning = false, S = 0;
  let currentTask = null;
  let lastPickedId = null;
  let editingId = null;
  

  function defaultActivities() {
    return DEFAULTS.map((d,i) => ({ id: uid(), name:d.name, group:d.group, enabled:true, weight:d.weight, minutes:d.minutes, points:d.points, color:d.color || pickColor(i) }));
  }
  function normalizeActivity(a, i) {
    return {
      id: (typeof a.id==='string' && a.id) ? a.id : uid(),
      name: String(a.name||'未命名').slice(0,20),
      group: String(a.group||'').slice(0,10),
      enabled: a.enabled !== false,
      weight: num(a.weight,0,20,1),
      minutes: num(a.minutes,0,600,0),
      points: num(a.points,-100,100,0),
      color: isValidColor(a.color) ? a.color : pickColor(i||0)
    };
  }
  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const p = JSON.parse(raw);
        if (p && Array.isArray(p.activities)) {
          return {
            activities: p.activities.map(normalizeActivity),
            score: Number(p.score) || 0,
            history: Array.isArray(p.history) ? p.history.slice(0,200) : [],
            streak: { count: Number(p.streak && p.streak.count) || 0, lastDate: (p.streak && p.streak.lastDate) || null },
            settings: {
              soundEnabled: p.settings ? p.settings.soundEnabled !== false : true,
              volume: p.settings ? num(p.settings.volume,0,1,0.5) : 0.5,
              theme: (p.settings && ['light','dark','auto'].includes(p.settings.theme)) ? p.settings.theme : 'auto',
              spinDuration: p.settings ? num(p.settings.spinDuration, 2000, 8000, 4200) : 4200
            }
          };
        }
      }
    } catch (e) {}
    return {
      activities: defaultActivities(), score: 0, history: [],
      streak: { count:0, lastDate:null },
      settings: { soundEnabled:true, volume:0.5, theme:'auto', spinDuration:4200 }
    };
  }
  function saveState() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {} }
 
  function markExported() { try { localStorage.setItem(EXPORT_KEY, Date.now().toString()); } catch(e){} }
  function markPulled() { try { localStorage.setItem(PULL_KEY, Date.now().toString()); } catch(e){} }
  function getLastPull() { return Number(localStorage.getItem(PULL_KEY)) || 0; }
  function getLastExport() { return Number(localStorage.getItem(EXPORT_KEY)) || 0; }

  const wheelBox=$('wheelBox'), canvas=$('wheel'), ctx=canvas.getContext('2d');
  const spinBtn=$('spinBtn'), resultEl=$('result'), checkinBtn=$('checkinBtn');
  const lockHint=$('lockHint'), lockHintText=$('lockHintText');
  const listEl=$('list');
  const timerCard=$('timerCard'), timerLabel=$('timerLabel'), timerState=$('timerState');
  const timerDisp=$('timerDisplay'), barEl=$('bar');
  const toggleBtn=$('toggleBtn'), resetBtn=$('resetBtn'), addBtn=$('addBtn');
  const scoreToday=$('scoreToday'), scoreTotal=$('scoreTotal'), streakValue=$('streakValue');
  const overlay=$('overlay'), historyList=$('historyList');
  const editOverlay=$('editOverlay'), editTitle=$('editTitle');
  const editName=$('editName'), editGroup=$('editGroup'), editColor=$('editColor');
  const editWeight=$('editWeight'), editMinutes=$('editMinutes'), editPoints=$('editPoints');
  const editDelete=$('editDelete'), colorPresets=$('colorPresets');
  const importFile=$('importFile');
  const confirmOverlay=$('confirmOverlay'), confirmIcon=$('confirmIcon');
  const confirmTitle=$('confirmTitle'), confirmSub=$('confirmSub'), confirmPoints=$('confirmPoints');
  const statsOverlay=$('statsOverlay'), statsBody=$('statsBody');
  const menuOverlay=$('menuOverlay');
  const onboardOverlay=$('onboardOverlay');
  const syncUrlOverlay=$('syncUrlOverlay');

  let audioCtx = null;
  function unlockAudio() {
    try {
      if (!audioCtx) { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return; audioCtx = new AC(); }
      if (audioCtx.state === 'suspended') audioCtx.resume();
    } catch(e) {}
  }
  ['pointerdown','touchstart','keydown'].forEach(evt => window.addEventListener(evt, unlockAudio, { passive:true }));

  function playChime(times) {
    if (!state.settings.soundEnabled) return;
    unlockAudio();
    if (!audioCtx) return;
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const vol = state.settings.volume; if (vol <= 0) return;
    const t0 = audioCtx.currentTime + 0.02, gap = 0.34;
    for (let i = 0; i < times; i++) {
      const t = t0 + i * gap;
      const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, t); osc.frequency.setValueAtTime(1245, t + 0.09);
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.32 * vol, t + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.26);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(t); osc.stop(t + 0.3);
    }
    if (navigator.vibrate) { try { navigator.vibrate([160,80,160,80,220]); } catch(e){} }
  }
  function playCheckinSound(positive) {
    if (!state.settings.soundEnabled) return;
    unlockAudio();
    if (!audioCtx) return;
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const vol = state.settings.volume; if (vol <= 0) return;
    const notes = positive ? [660, 880, 1174] : [520, 400, 300];
    const t0 = audioCtx.currentTime + 0.01;
    notes.forEach((freq, i) => {
      const start = t0 + i * 0.1;
      const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
      osc.type = 'sine'; osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(0.25 * vol, start + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.22);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(start); osc.stop(start + 0.25);
    });
  }
  /* 转盘旋转音效：滴答 */
  function playTickSound() {
    if (!state.settings.soundEnabled) return;
    unlockAudio();
    if (!audioCtx) return;
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const vol = state.settings.volume * 0.12;
    if (vol <= 0) return;
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.value = 1150;

    eye.title = a.enabled === false ? '点击启用' : '点击暂停';
    eye.addEventListener('click', e => { e.stopPropagation(); a.enabled = a.enabled === false ? true : false; saveState(); renderList(); draw(); });
    row.append(handle, left, wIn, mIn, pIn, eye);
    attachDrag(handle, row, a.id);
    return row;
  }

  function attachDrag(handle, row, id) {
    handle.addEventListener('pointerdown', e => {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      e.preventDefault();
      const wrap = row.parentElement; if (!wrap) return;
      const rect = row.getBoundingClientRect();
      const startY = e.clientY, startTop = rect.top, startLeft = rect.left;
      const width = rect.width, height = rect.height;
      const ghost = row.cloneNode(true);
      ghost.style.cssText = `position:fixed; left:${startLeft}px; top:${startTop}px; width:${width}px; height:${height}px; margin:0; pointer-events:none; z-index:9999; opacity:.95; background:var(--card); border-radius:10px; box-shadow:0 12px 32px rgba(0,0,0,.22); padding:4px 2px; display:grid; grid-template-columns:26px minmax(0,1fr) 40px 40px 40px 22px; gap:5px; align-items:center;`;
      document.body.appendChild(ghost);
      row.classList.add('dragging'); document.body.style.userSelect = 'none';
      function move(ev) {
        if (ev.pointerId !== e.pointerId) return;
        ghost.style.top = (startTop + ev.clientY - startY) + 'px';
        const el = document.elementFromPoint(ev.clientX, ev.clientY);
        if (!el) return;
        const target = el.closest ? el.closest('.row') : null;
        if (!target || target === row) return;
        if (target.parentElement !== wrap) return;
        const tr = target.getBoundingClientRect();
        const before = ev.clientY < tr.top + tr.height/2;
        if (before) wrap.insertBefore(row, target); else wrap.insertBefore(row, target.nextSibling);
      }
      function up(ev) {
        if (ev.pointerId !== e.pointerId) return;
        document.removeEventListener('pointermove', move); document.removeEventListener('pointerup', up); document.removeEventListener('pointercancel', up);
        ghost.remove(); row.classList.remove('dragging'); document.body.style.userSelect = '';
        const newOrder = [];
        listEl.querySelectorAll('.group-wrap').forEach(w => { w.querySelectorAll('.row').forEach(r => { const a = state.activities.find(x => x.id === r.dataset.id); if (a) newOrder.push(a); }); });
        if (newOrder.length === state.activities.length) {
          state.activities = newOrder; saveState();
          row.classList.add('just-moved'); setTimeout(() => row.classList.remove('just-moved'), 400);
          draw();
        }
      }
      document.addEventListener('pointermove', move); document.addEventListener('pointerup', up); document.addEventListener('pointercancel', up);
    });
  }

  function sortActivities(key) {
    if (!state.activities.length) return;
    const arr = state.activities.slice();
    if (key === 'name') arr.sort((a,b) => a.name.localeCompare(b.name,'zh-Hans-CN'));
    else if (key === 'weight') arr.sort((a,b) => b.weight - a.weight);
    else if (key === 'points') arr.sort((a,b) => b.points - a.points);
    state.activities = arr; saveState(); renderList(); draw();
  }

  function buildColorPresets() {
    colorPresets.innerHTML = '';
    PALETTE.forEach(c => {
      const s = document.createElement('span'); s.className = 'preset'; s.style.background = c; s.dataset.color = c;
      s.addEventListener('click', () => { editColor.value = c; updatePresetActive(); });
      colorPresets.appendChild(s);
    });
  }
  function updatePresetActive() {
    const cur = editColor.value.toLowerCase();
    colorPresets.querySelectorAll('.preset').forEach(p => { p.classList.toggle('active', p.dataset.color.toLowerCase() === cur); });
  }
  function openEditor(id) {
    editingId = id || null;
    if (id) {
      const a = state.activities.find(x => x.id === id); if (!a) return;
      editTitle.textContent = '编辑活动'; editName.value = a.name; editGroup.value = a.group || '';
      editColor.value = a.color; editWeight.value = a.weight; editMinutes.value = a.minutes; editPoints.value = a.points;
      editDelete.style.display = '';
    } else {
      editTitle.textContent = '新建活动'; editName.value = ''; editGroup.value = '';
      editColor.value = pickColor(state.activities.length); editWeight.value = 1; editMinutes.value = 25; editPoints.value = 10;
      editDelete.style.display = 'none';
    }
    updatePresetActive(); editOverlay.hidden = false; setTimeout(() => editName.focus(), 60);
  }
  function closeEditor() { editOverlay.hidden = true; editingId = null; }
  function saveEditor() {
    const name = editName.value.trim().slice(0,20);
    if (!name) { editName.focus(); editName.style.borderColor = 'var(--red)'; setTimeout(() => { editName.style.borderColor = ''; }, 1200); return; }
    const data = { name, group: editGroup.value.trim().slice(0,10), color: isValidColor(editColor.value) ? editColor.value : pickColor(0), weight: num(editWeight.value,0,20,1), minutes: num(editMinutes.value,0,600,0), points: num(editPoints.value,-100,100,0) };
    if (editingId) { const a = state.activities.find(x => x.id === editingId); if (a) Object.assign(a, data); }
    else { state.activities.push({ id: uid(), enabled:true, ...data }); }
    saveState(); renderList(); draw(); closeEditor();
  }
  function removeActivity(id) {
    state.activities = state.activities.filter(a => a.id !== id);
    if (currentTask && currentTask.item.id === id) { currentTask = null; updateCheckinBtn(); }
    saveState(); renderList(); draw();
  }

  function renderStats() {
    statsBody.innerHTML = '';
    const totalCheckins = state.history.length;
    const todayScore = getTodayScore();
    let totalMinutes = 0;
    state.history.forEach(h => { const a = state.activities.find(x => x.id === h.activityId); if (a && h.delta > 0) totalMinutes += a.minutes || 0; });
    const grid = document.createElement('div'); grid.className = 'stats-grid';
    [{ n: state.streak.count + '天', l: '连续打卡', c: 'amber' }, { n: todayScore, l: '今日积分', c: 'green' }, { n: totalCheckins, l: '总打卡次数', c: 'blue' }, { n: totalMinutes + '分', l: '累计学习时长', c: '' }].forEach(b => {
      const d = document.createElement('div'); d.className = 'stat-box';
      d.innerHTML = `<div class="stat-num ${b.c}">${b.n}</div><div class="stat-lbl">${b.l}</div>`;
      grid.appendChild(d);
    });
    statsBody.appendChild(grid);
    const title1 = document.createElement('div'); title1.className = 'group-label'; title1.textContent = '近 7 天积分'; statsBody.appendChild(title1);
    const days = [];
    for (let i = 6; i >= 0; i--) {
      const d = new Date(); d.setDate(d.getDate() - i);
      const ds = dateStr(d);
      const score = state.history.filter(h => tsToDateStr(h.time) === ds).reduce((s,h) => s + (h.delta||0), 0);
      days.push({ d, score, ds });
    }
    const maxAbs = Math.max(1, ...days.map(x => Math.abs(x.score)));
    const chart = document.createElement('div'); chart.className = 'week-chart';
    days.forEach(({ d, score }) => {
      const col = document.createElement('div'); col.className = 'week-col';
      const wrap = document.createElement('div'); wrap.className = 'week-bar-wrap';
      const bar = document.createElement('div');
      bar.className = 'week-bar' + (score < 0 ? ' neg' : score === 0 ? ' zero' : '');
      bar.style.height = (score === 0 ? 3 : Math.max(6, Math.round(Math.abs(score) / maxAbs * 70))) + 'px';
      wrap.appendChild(bar);
      const lbl = document.createElement('div'); lbl.className = 'week-lbl'; lbl.textContent = ['日','一','二','三','四','五','六'][d.getDay()];
      const val = document.createElement('div'); val.className = 'week-val'; val.textContent = score !== 0 ? score : '';
      col.append(wrap, lbl, val); chart.appendChild(col);
    });
    statsBody.appendChild(chart);
    const title2 = document.createElement('div'); title2.className = 'group-label'; title2.textContent = '活动打卡排行'; statsBody.appendChild(title2);
    const stats = {};
    state.history.forEach(h => {
      const key = h.activityId || h.reason;
      if (!stats[key]) stats[key] = { name: h.reason, count: 0, minutes: 0, color: '#c3cad6' };
      stats[key].count += 1;
      const a = state.activities.find(x => x.id === h.activityId);
      if (a) { stats[key].color = a.color; stats[key].minutes += (a.minutes || 0); stats[key].name = a.name; }
    });
    const arr = Object.values(stats).sort((a,b) => b.count - a.count).slice(0, 8);
    if (!arr.length) { const t = document.createElement('div'); t.className = 'empty-tip'; t.textContent = '还没有打卡记录'; statsBody.appendChild(t); }
    else {
      const list = document.createElement('div'); list.className = 'stat-list';
      arr.forEach(s => {
        const line = document.createElement('div'); line.className = 'stat-line';
        const dot = document.createElement('span'); dot.className = 'dot'; dot.style.background = s.color;
        const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = s.name;
        const numEl = document.createElement('span'); numEl.className = 'num'; numEl.textContent = `${s.count} 次 · ${s.minutes} 分`;
        line.append(dot, nm, numEl); list.appendChild(line);
      });
      statsBody.appendChild(list);
    }
  }

  function exportData() {
    const data = { app:'today-wheel', version:3, exportedAt:new Date().toISOString(), activities:state.activities, score:state.score, history:state.history, streak:state.streak, settings:state.settings };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); const d = new Date(); const p = n => String(n).padStart(2,'0');
    a.href = url; a.download = `today-wheel-${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1500);
    markExported();
    $('backupBanner').hidden = true;
  }
  function importData(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const data = JSON.parse(ev.target.result);
        if (!data || !Array.isArray(data.activities)) throw new Error('文件格式不正确');
        const list = data.activities.map(normalizeActivity).slice(0, 100);
        if (!list.length) throw new Error('没有有效的活动数据');
        if (!confirm(`将导入 ${list.length} 个活动，总积分 ${Number(data.score)||0}，历史 ${Array.isArray(data.history)?data.history.length:0} 条。\n\n当前数据将被替换，确定继续吗？`)) return;
        applyImported(data);
        alert('✅ 导入成功！');
      } catch (err) { alert('导入失败：' + (err.message || '未知错误')); }
    };
    reader.onerror = () => alert('读取文件失败，请重试');
    reader.readAsText(file);
  }
  function applyImported(data) {
    state.activities = data.activities.map(normalizeActivity).slice(0, 100);
    state.score = Number(data.score) || 0;
    state.history = Array.isArray(data.history) ? data.history.slice(0,200).map(h => ({ delta: Number(h.delta)||0, reason: String(h.reason||'').slice(0,30), time: Number(h.time)||Date.now(), activityId: h.activityId||null })) : [];
    state.streak = { count: Number(data.streak && data.streak.count) || 0, lastDate: (data.streak && data.streak.lastDate) || null };
    if (data.settings) {
      state.settings.soundEnabled = data.settings.soundEnabled !== false;
      state.settings.volume = num(data.settings.volume, 0, 1, 0.5);
      state.settings.theme = ['light','dark','auto'].includes(data.settings.theme) ? data.settings.theme : 'auto';
      state.settings.spinDuration = num(data.settings.spinDuration, 2000, 8000, 4200);
    }
    currentTask = null; updateCheckinBtn();
    saveState();
    renderList(); draw(); updateScoreUI(0); renderHistory(); updateUndoBtn();
    applyTheme(); syncSettingsUI(); refreshSpinBtn();
    checkBackup();
  }

 
 
 
  function syncSettingsUI() {
    $('soundSwitch').classList.toggle('on', state.settings.soundEnabled);
    $('volumeRange').value = Math.round(state.settings.volume * 100);
    $('volumeLabel').textContent = Math.round(state.settings.volume * 100) + '%';
    $('volumeField').style.display = state.settings.soundEnabled ? '' : 'none';
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    $('themeSwitch').classList.toggle('on', isDark);
    $('speedRange').value = state.settings.spinDuration || 4200;
  }

  /* ===== 备份提醒 ===== */
  function checkBackup() {
    const banner = $('backupBanner');
    if (!banner) return;
    if (state.history.length < 5) { banner.hidden = true; return; }
    const last = getLastExport();
    if (last === 0) {
      $('backupHint').textContent = '（从未导出过）';
      banner.hidden = false;
      return;
    }
    const days = Math.floor((Date.now() - last) / 86400000);
    if (days >= 7) {
      $('backupHint').textContent = `（已 ${days} 天未导出）`;
      banner.hidden = false;
    } else {
      banner.hidden = true;
    }
  }

  
  /* ===== 事件绑定 ===== */
  spinBtn.addEventListener('click', spin);
  checkinBtn.addEventListener('click', () => checkin(false));
  toggleBtn.addEventListener('click', () => { unlockAudio(); timer.running ? pauseTimer() : startTimer(); });
  resetBtn.addEventListener('click', resetTimer);
  addBtn.addEventListener('click', () => addMinutes(5));
  $('addBtn2').addEventListener('click', () => openEditor(null));
  $('sortWeight').addEventListener('click', () => sortActivities('weight'));
  $('sortPoints').addEventListener('click', () => sortActivities('points'));
  $('sortName').addEventListener('click', () => sortActivities('name'));
  $('editSave').addEventListener('click', saveEditor);
  $('editDelete').addEventListener('click', () => {
    if (!editingId) return;
    const a = state.activities.find(x => x.id === editingId); if (!a) return;
    if (confirm(`确定删除「${a.name}」吗？`)) { const id = editingId; closeEditor(); removeActivity(id); }
  });
  $('closeEdit').addEventListener('click', closeEditor);
  editOverlay.addEventListener('click', e => { if (e.target === editOverlay) closeEditor(); });
  editColor.addEventListener('input', updatePresetActive);
  editName.addEventListener('keydown', e => { if (e.key === 'Enter') saveEditor(); });

  $('statsBtn').addEventListener('click', () => { renderStats(); statsOverlay.hidden = false; });
  $('closeStats').addEventListener('click', () => { statsOverlay.hidden = true; });
  statsOverlay.addEventListener('click', e => { if (e.target === statsOverlay) statsOverlay.hidden = true; });
  $('undoBtn').addEventListener('click', undoLast);

  $('menuBtn').addEventListener('click', () => { syncSettingsUI(); menuOverlay.hidden = false; });
  $('closeMenu').addEventListener('click', () => { menuOverlay.hidden = true; });
  menuOverlay.addEventListener('click', e => { if (e.target === menuOverlay) menuOverlay.hidden = true; });

 
  // 备份提醒
  $('backupExportBtn').addEventListener('click', () => { exportData(); });
  $('backupDismissBtn').addEventListener('click', () => { $('backupBanner').hidden = true; });

  $('soundSwitch').addEventListener('click', () => { state.settings.soundEnabled = !state.settings.soundEnabled; saveState(); syncSettingsUI(); if (state.settings.soundEnabled) playChime(1); });
  $('volumeRange').addEventListener('input', e => { state.settings.volume = num(e.target.value, 0, 100, 50) / 100; $('volumeLabel').textContent = Math.round(state.settings.volume * 100) + '%'; saveState(); });
  $('volumeRange').addEventListener('change', () => { if (state.settings.soundEnabled) playChime(1); });
  $('themeSwitch').addEventListener('click', () => { const cur = document.documentElement.getAttribute('data-theme'); state.settings.theme = cur === 'dark' ? 'light' : 'dark'; saveState(); applyTheme(); syncSettingsUI(); draw(); });
  $('speedRange').addEventListener('input', e => { state.settings.spinDuration = num(e.target.value, 2000, 8000, 4200); saveState(); });

  $('exportBtn').addEventListener('click', exportData);
  $('importBtn').addEventListener('click', () => importFile.click());
  importFile.addEventListener('change', e => { const f = e.target.files && e.target.files[0]; importFile.value = ''; if (f) importData(f); });

  $('resetAllBtn').addEventListener('click', () => {
    if (!state.score && !state.history.length) return;
    if (!confirm('确定清空积分与所有记录吗？\n（活动设置不受影响）')) return;
    state.score = 0; state.history = []; state.streak = { count: 0, lastDate: null };
    saveState(); updateScoreUI(0); renderHistory(); updateUndoBtn();
   });

  $('confirmDone').addEventListener('click', () => { confirmOverlay.hidden = true; checkin(false); });
  $('confirmLater').addEventListener('click', () => { confirmOverlay.hidden = true; });
  confirmOverlay.addEventListener('click', e => { if (e.target === confirmOverlay) confirmOverlay.hidden = true; });

  document.addEventListener('keydown', e => {
    if (e.code === 'Space' && e.target === document.body) { e.preventDefault(); spin(); }
    if (e.key === 'Escape') {
      if (!confirmOverlay.hidden) confirmOverlay.hidden = true;
      else if (!editOverlay.hidden) closeEditor();
      else if (!statsOverlay.hidden) statsOverlay.hidden = true;
      else if (!menuOverlay.hidden) menuOverlay.hidden = true;
      else if (!syncUrlOverlay.hidden) syncUrlOverlay.hidden = true;
      else if (!onboardOverlay.hidden) onboardOverlay.hidden = true;
      else if (!overlay.hidden) overlay.hidden = true;
    }
  });

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) { checkStreakReset(); if (timer.running) tickTimer(); updateScoreUI(0); refreshSpinBtn(); checkBackup(); }
  });

  function setupPWA() {
    const svgIcon = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5b85ff"/><stop offset="1" stop-color="#4f7cff"/></linearGradient></defs><rect width="512" height="512" rx="112" fill="url(#g)"/><g transform="translate(256,256)"><path d="M0,-190 A190,190 0 0,1 165,95 L0,0 Z" fill="#ffffff" opacity=".95"/><path d="M165,95 A190,190 0 0,1 -165,95 L0,0 Z" fill="#ffd166"/><path d="M-165,95 A190,190 0 0,1 0,-190 L0,0 Z" fill="#7bc8d9"/></g><circle cx="256" cy="256" r="36" fill="#ffffff"/><circle cx="256" cy="256" r="14" fill="#4f7cff"/></svg>`;
    const iconUrl = 'data:image/svg+xml,' + encodeURIComponent(svgIcon);
    const manifest = {
      name: '今天做什么', short_name: '今天做什么', description: '转盘抽签 + 打卡积分',
      start_url: '.', scope: '.', display: 'standalone', orientation: 'any',
      background_color: '#f4f6f9', theme_color: '#4f7cff', lang: 'zh-CN',
      icons: [
        { src: iconUrl, sizes: '192x192', type: 'image/svg+xml', purpose: 'any' },
        { src: iconUrl, sizes: '512x512', type: 'image/svg+xml', purpose: 'any' },
        { src: iconUrl, sizes: '512x512', type: 'image/svg+xml', purpose: 'maskable' }
      ]
    };
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifest));
    document.head.appendChild(link);
    const apple = document.createElement('link');
    apple.rel = 'apple-touch-icon'; apple.href = iconUrl; document.head.appendChild(apple);
    const appleStartup = document.createElement('link');
    appleStartup.rel = 'apple-touch-startup-image'; appleStartup.href = iconUrl; document.head.appendChild(appleStartup);
    if ('serviceWorker' in navigator) {
      const swCode = `
        const CACHE = 'wheel-v3';
        self.addEventListener('install', e => { self.skipWaiting(); });
        self.addEventListener('activate', e => { e.waitUntil(self.clients.claim()); });
        self.addEventListener('fetch', e => {
          const req = e.request;
          if (req.method !== 'GET') return;
          if (req.url.includes('jsonblob.com')) return;
          e.respondWith(
            caches.open(CACHE).then(cache =>
              cache.match(req).then(res => {
                if (res) return res;
                return fetch(req).then(r => {
                  if (r && r.ok && r.type === 'basic') cache.put(req, r.clone());
                  return r;
                }).catch(() => res);
              })
            )
          );
        });
      `;
      try {
        const blob = new Blob([swCode], { type:'application/javascript' });
        const swUrl = URL.createObjectURL(blob);
        navigator.serviceWorker.register(swUrl).catch(() => {});
      } catch (e) {}
    }
  }

  /* ===== 启动 ===== */
  async function boot() {
    buildColorPresets();
    renderList();
    resizeCanvas();
    updateTimerUI();
    updateScoreUI(0);
    renderHistory();
    updateUndoBtn();
    applyTheme();
    syncSettingsUI();
    checkStreakReset();
    refreshSpinBtn();
    setupPWA();

    if (window.ResizeObserver) new ResizeObserver(resizeCanvas).observe(wheelBox);
    else window.addEventListener('resize', resizeCanvas);

    setInterval(() => {
      const t = todayStr();
      if (state._lastDay && state._lastDay !== t) { checkStreakReset(); updateScoreUI(0); checkBackup(); }
      state._lastDay = t;
    }, 30000);
    state._lastDay = todayStr();

     // 检查备份提醒
    checkBackup();
  }

  boot();
   restoreTimerState();
  /* ===== 同步状态到总工作台 ===== */
  function syncStatusToHub(){
    try {
      localStorage.setItem('wb-status:wheel', JSON.stringify({
        todayScore: getTodayScore(),
        streak: state.streak.count,
        updatedAt: Date.now()
      }));
    } catch(e){}
  }
  setTimeout(syncStatusToHub, 500);
  setInterval(syncStatusToHub, 30000);
  document.addEventListener('visibilitychange', function(){
    if (document.hidden) syncStatusToHub();
  });
  window.addEventListener('beforeunload', syncStatusToHub);

})();
</script>
